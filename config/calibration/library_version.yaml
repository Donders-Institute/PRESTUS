## Transducer Library Version Manifest
#
# Bump patch (x.y.Z) when adding characterised depths to an existing combo.
# Bump minor (x.Y.0) when adding a new combo or transducer serial.
# Bump major (X.0.0) for breaking changes to the YAML schema.
#
# Run validate_transducer_library(equip_path, library_path) to verify all
# entries listed here are present and consistent with the equipment config.

version: "0.1.0"
prestus_version: "v0.5"
built_at: "2026-06-09"

# One entry per library YAML in this folder.
# Fields:
#   n_depths       — number of characterised focal depths
#   depth_range_mm — [min, max] of characterised depths from exit plane
#   intensities    — ISPPA values [W/cm²] for which amplitude is calibrated
#   calibration_type — empirical | geometric
#   notes          — free-text; include characterisation conditions
combos:
