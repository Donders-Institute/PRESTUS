# The configuration is structured using YAML (https://yaml.org/). Note that YAML uses spaces, not tabs, for identation.

# !!! Important !!! Do not edit this document. Instead, copy (at least) the first segment into your own config file.

#------------------------------------------------
#------------ Setup-specific specfication (Defaults)
# The following information is study-specific.
# Defaults should be overwritten (where sensible or necessary) in a separate <simulation-X>config.yaml file.
#------------------------------------------------

#------------ General

subject_id: 0    # Participant ID (integer, used for path substitution in path.t1_pattern and path.t2_pattern)
platform: 'auto' # Execution platform: auto (recommended) | slurm | qsub | matlab (recommended for debugging)
# acoustic_backend: 'kwave'   # Acoustic solver: 'kwave' (default) | 'kwave_elastic' (shear waves in skull) | 'babelbrain' | 'jwave'
# thermal_backend:  'kwave'   # Thermal solver: 'kwave' (default) | 'babelbrain' (requires acoustic_backend: 'babelbrain')

#------------ Simulation type & execution

simulation:
  medium: layered     # select which medium setup to use: 'water' or 'layered' (a layered medium consists of several layers defined below)
  code_type: matlab_gpu # Select which k-Wave code to run:
                        #   MATLAB CPU code 'matlab_cpu'
                        #   MATLAB GPU code 'matlab_gpu'
                        #   C++ CPU code 'cpp_cpu'
                        #   C++ GPU code 'cpp_gpu'
  precision: 'single' # Computational precision for both acoustic and thermal simulations
  interactive: 0      # Run in interactive mode (ask for user input when necessary, plot evolving figures)
  debug: 0            # Activate debug mode with additional intermediate outputs?
  transducer_coupling: coherent # How multiple transducers interact acoustically:
                                #   'coherent'  — pressure fields are superposed in a single k-Wave run
                                #                 (models interference; current default behaviour)
                                #   'async'     — each transducer is simulated independently and
                                #                 intensities are summed incoherently before thermal
                                #                 simulation (models asynchronous / non-overlapping firing)
  uncertainty_temp_high: ''     # Medium properties of the Temp-H variant of simulation.uncertainty (bounds that maximise brain
                                #   heating): a YAML file with a medium_properties block, merged onto this config (absolute
                                #   path, or a file name in config/uncertainty/). '' = config/uncertainty/config_medium_temp_high.yaml
  uncertainty_temp_low: ''      # Temp-L variant (bounds that minimise brain heating), as above. '' = config_medium_temp_low.yaml
  uncertainty_trans_high: ''    # Trans-H variant (bounds that maximise brain intensity; acoustic only), as above.
                                #   '' = config_medium_trans_high.yaml
  uncertainty_trans_low: ''     # Trans-L variant (bounds that minimise brain intensity; acoustic only), as above.
                                #   '' = config_medium_trans_low.yaml

#------------ Paths

path:
  anat: ''              # Location of the structural input data [full path]
  sim: ''               # Location of the simulation outputs [full path; a relative path is relative to the MATLAB working directory]
  seg: ''               # Location of the segmentation directories (containing m2m folders) [full path]
  placement: ''         # Placement outputs (heuristic, PlanTUS, TUS_entry runs): <placement>/sub-XXX/<mode>/<target_name>/.
                        # Empty = <sim>/placement. Point several setups at one folder to share placements across them.
  t1_pattern: 'sub-%1$03d_T1w.nii*' # T1 image path template relative to path.anat; supports %03d-style subject ID substitution
  t2_pattern: '' # T2 image path template relative to path.anat (optional; leave empty to skip T2)
  # Localite neuronavigation (see doc_placement_neuronav.md, "Localite I/O")
  localite_raw: ''      # Raw Localite exports: <localite_raw>/sub-XXX/ses-XX/[<placement.localite.loc_folder>/]...
  localite_post: ''     # Ingested markers (neuronav_ingest_markers): <localite_post>/sub-XXX/ses-XX/InstrumentMarker_sub-XXX_ses-XX.xml/.json
  localite_t1: ''       # Planning T1s loaded into Localite: <localite_t1>/[sub-XXX/]<localite_t1_pattern>; empty = localite_raw
  localite_t1_pattern: '%s_*T1*.nii*' # sprintf template for the planning T1 file name; %s = 'sub-XXX'
  localite_export: ''   # Output folder for files to import into Localite (heuristic placement); per subject: <localite_export>/sub-XXX/
  localite: ''          # DEPRECATED: read as localite_raw when that is empty, and as localite_export when that is empty
  pct: ''               # Base output directory for pseudoCT files: <pct>/sub-NNN/. Empty = <parent of seg>/pct/sub-NNN/
                        # (next to the SimNIBS folder; the m2m folders are only read).
  acoustic_input: ''    # Start from a prior pressure map instead of simulating: a peak-pressure NIfTI [Pa] in this
                        # subject's T1w space, e.g. an earlier run's nii/T1w/*_pressure.nii.gz. Its .json sidecar is
                        # used to check the settings and rescale to transducer.target_isppa_wcm2; acoustic analysis
                        # and thermal simulation then run as usual. Empty = simulate.

#------------ Startup (environment & toolbox paths)

startup:
  simnibs_bin_path: ''  # Path to the SimNIBS environment (please use full paths)
  matlab_bin_path: ''   # Path to MATLAB binary, required for pseudoCT generation on HPC (e.g. /opt/matlab/R2024a/bin/matlab)
  fsl_bin_path: ''      # Path to FSL bin directory, required for pseudoCT generation (e.g. /opt/fsl/bin); used to set PATH
  ants_bin_path: ''     # Path to ANTs bin directory, required for pseudoCT generation (e.g. /opt/ants/bin); used to set PATH
  ants_simg_path: ''    # Path to ANTs Singularity image (.simg/.sif); if set, ANTs tools are run via singularity exec
  modules_to_load: []   # HPC environment modules to load before pCT generation (e.g. ['matlab/R2023b','fsl/6.0.7','ants/2.5.3'])
  paths_to_add: []      # Additional paths to add with addpath()
  subpaths_to_add: []   # Paths to add recursively with addpath(genpath()); relative to the MATLAB working directory

#------------ I/O management

io:
  output_affix: ''          # Optional affix for output file names; differentiates outputs for the same subject/transducer
  overwrite_files: always   # 'never' reuse existing files; 'always' overwrite (chained pipelines: re-run output stages, reuse intermediate caches); 'force' also re-run chained intermediate stages; any other value asks for confirmation. See doc_outputs.md#overwrite-behaviour
  cache_signature_check: error # Reused grid/medium/acoustic caches (overwrite_files: never) must match this run's settings: 'error' | 'warn' (reuse anyway) | 'off'
  overwrite_simnibs: 0      # By default, SimNIBS segmentation results are not overwritten, unless enabled here
  # Intermediate matrix saving
  # save_matrices sets all intermediate matrix saves at once: 1 = save all, 0 = save none.
  # A per-step flag below overrides it when set to 0 or 1; leave it empty ([]) to inherit
  # save_matrices. When both are empty, the default in [brackets] applies.
  # (Grid and medium caches follow the same rule via save_grid_cache / save_medium_cache [0].)
  save_matrices: []           # Global switch for all intermediate matrices ([] = use per-step defaults)
  save_source_matrices: []    # [1] kwave_source.mat — transducer source array; shared across variants
  save_acoustic_matrices: []  # [0] Acoustic sensor_data + kgrid + kwave_medium + source (can be very large)
  save_thermal_matrices: []   # [1] heating_res.mat — temperature timeseries and field maps
  save_heatingvideo: 0      # Save a video of incremental heating?
  save_property_maps: 0    # Save per-property NIfTIs to nii/properties/ (layered medium only)
  save_MNI: 1              # Save NIfTI outputs in MNI space in addition to native T1w space (requires SimNIBS m2m folder)
  save_Ipa: 1              # Save pulse-average intensity (Ipa) NIfTI map; suppressed automatically when timing.pd absent
  save_Ita: 1              # Save temporal-average intensity (Ita) NIfTI map; suppressed automatically when timing.pd/.pri absent
  save_p_complex: 0         # Save complex pressure field (p_complex) alongside p_max_all in the acoustic cache? (large)


#------------ Calibration (equipment-level metadata, not ISPPA targeting)

calibration:
  # target_isppa_wcm2 has moved to transducer.target_isppa_wcm2 (per-transducer).
  # Setting calibration.target_isppa_wcm2 here still works but is deprecated and
  # will be removed in a future release.

  # Convention used to interpret focal-depth labels in calibration source data
  # (empirical CSV columns, manufacturer steering tables): what does e.g.
  # "80 mm" in a steering table actually refer to on the transducer's own
  # axial profile? Must match how the equipment vendor defines it -- verify
  # against a vendor-provided profile/steering table before trusting a value
  # other than the default. Written into the calibration output YAML sidecar
  # (meta.calibration.focal_reference) so downstream consumers know how the
  # depth label was interpreted.
  #   'peak'      - the raw axial intensity maximum
  #   'flhm_3db'  - full-length-at-half-maximum centre, intensity >= peak/2
  #                 (ITRUSST / Martin et al. 2025 default)
  #   'flhm_6db'  - full-length-at-half-maximum centre, intensity >= peak/4,
  #                 i.e. half of peak PRESSURE amplitude (as in Imasonic/IGT
  #                 steering tables)
  focal_reference: flhm_3db

#------------ Module execution

modules:
  run_transducer_placement: 1 # Resolve trans_pos/focus_pos via placement.mode (manual/localite/heuristic/mni/plantus/tus_entry)?
  run_grid_setup: 1           # Setup grid and run head processing? Mandatory for simulations.
  run_medium_setup: 1         # Map medium acoustic properties? Mandatory for simulations.
  run_source_setup: 1         # Set up acoustic source? Mandatory for simulations.
  run_water_baseline: auto    # Free-water baseline sim for target_isppa_wcm2 scaling: auto (when a target needs it), 1 (always), 0 (only if target differs from calibration)
  run_acoustic_sims: 1        # Run acoustic simulations?
  run_acoustic_analysis: 1    # Run acoustic analysis?
  run_heating_sims: 0         # Run thermal simulations? Default: off; run once acoustic simulation provides sensible results.
  run_thermal_analysis: 1     # Run thermal analysis?
  run_nifti_creation: 1       # Run nifti creation?
  run_posthoc_water_sims: 1   # Run simulations in free water with identical setup?
  generate_report: 1          # Generate a self-contained HTML simulation report at the end of the pipeline?
  report_style: 'instrument'  # Report skin: instrument (default) | classic (pre-v0.6.1 look) | compact (dense) | paper (print). Presentation only.
  report_style_switcher: 0    # Embed all skins plus a style dropdown in the report? 1=yes, 0=no. Test styles on existing outputs: preview_report_styles(<subject dir>)
  run_targeting_analysis: 1   # Measure targeting accuracy from the focal-mask NIfTIs (simulated focus vs planned focus, MNI target / ROI)? Writes sub-XXX_<medium><affix>_targeting.csv. Layered or phantom media; needs run_nifti_creation.
  generate_group_report: 1    # Auto-generate the group HTML report after each per-subject run? 0=manual (call prestus_group_report_start), 1=auto. Off for runs started by prestus_study_start (the study report is built once at the end).
  segmentation_only: 0        # Stop after segmentation (skip grid setup and all simulations)? 1=yes, 0=no

#------------ Study (multi-subject setup; see doc_group.md)

study:
  manifest: ''  # Study manifest (.tsv/.csv): one row per run (subject_id [, condition, include, config]) plus
                #   any per-run config keys as columns (e.g. placement.localite.target, transducer.target_isppa_wcm2).
                #   Relative paths are resolved against this config's folder. Run all rows with prestus_study_start(<this config>).
  name: ''      # Study name for the group outputs in <path.sim>/group/<name>/; '' = manifest file name

#------------ High-performance computing
hpc:
  name: 'default'   # 'default' or 'snellius'
  gpu: ''
  partition: ''
  reservation: ''
  wait_for_job: false
  timelimit: '04:00:00'
  memorylimit: 20
  posthoc_water_timelimit: '05:00:00'  # Wall time for the post-hoc free-water jobs (modules.run_posthoc_water_sims)
  posthoc_water_memorylimit: 40        # Memory [GB] for the post-hoc free-water jobs
  ld_library_path: '' # [qsub] /opt/gcc/7.2.0/lib64 | [slurm]: /home/'group'/'user'/.conda/envs/simnibs_env/lib/python3.9/site-packages/simnibs/mesh_tools/cgal/../../external/lib/linux
  job_prefix: 'PS' # Prefix for HPC job names (keep short; total name capped at 20 chars)
  max_wait_checks: 540  # Maximum number of status checks when waiting for a job (1 check/20s ≈ 3 hours)

# Smallest possible allocation (https://servicedesk.surf.nl/wiki/spaces/WIKI/pages/30660209/Snellius+partitions+and+accounting)
snellius:
  gpu_a100:
    cores: 18
    memorylimit: 120
    timelimit: "120:00:00" # max wall time of 120 h
    n_gpu: 1
  gpu_h100:
    cores: 16
    memorylimit: 180
    timelimit: "120:00:00" # max wall time of 120 h
    n_gpu: 1

#------------ Target analysis
analysis:
  focus_area_radius: 5  # Radius of the target area around the focus in which the ISPPA is averaged for the outputs [mm]
  target_mni_mm: []     # [x y z] intended target in MNI mm for targeting accuracy (modules.run_targeting_analysis).
                        #   [] = the MNI target of the placement mode (heuristic/plantus mni_target_mm, mni focus_pos_mm), if any.
  target_roi_mni: ''    # Target ROI mask in MNI space (NIfTI) for targeting accuracy: overlap with the -3 dB focal volume,
                        #   ROI coverage, Ipa in the ROI. '' = none.

#------------ Transducer specification  (no defaults)
#
# target_isppa_wcm2: target free-water ISPPA for this transducer [W/cm²].
#   Scalar  → scale to that intensity before thermal analysis.
#   Vector  → run one thermal job per value (multi-ISPPA sweep mode).
#   Empty   → no scaling; use elem_p_amp drive level as-is.
#   Several transducers: each one's own free-water ISPPA (that transducer
#   alone). async: each field is scaled to its target before combining.
#   coherent: each transducer's elem_p_amp is set to its target BEFORE the
#   simulation (free-water baseline of that transducer alone); vectors and
#   path.acoustic_input are not available.
#
# The acoustic simulation runs at the elem_p_amp specified below (coherent
# multi-transducer runs: at the per-transducer drive set from the targets).
# Scaling needs a free-water baseline ISPPA. With modules.run_water_baseline: auto
# (default) it runs whenever a target is set and the transducer has no matching
# calibration ISPPA; a target that cannot be met stops the run with an error.

transducer:
  name: []              # Optional transducer name / identifier (e.g., 'CTX500-026')
  type: []              # 'annular' for Annular array or 'matrix' for Matrix array
  freq_hz: []           # Fundamental frequency [Hz]
  target_isppa_wcm2: 30 # Target free-water ISPPA [W/cm²]; scalar or vector (see above)
  # serial: ''            # Equipment serial (config/equipment/<serial>.yaml); fills in geometry and library phases/drive
  # combo: {ds_serial: ''} # Driving-system serial; selects config/calibration/<serial>_<ds_serial>.yaml
  # library_path: ''      # Folder with your own library entries (refine_transducer_library / calibration_gui); used when it holds this combo
  # condition: ''        # EXPERIMENTAL, not validated: dephased library condition (lib.conditions.<label>) instead of focal_distance_ep

  trans_pos: []              # Transducer position (bowl apex) [T1 voxels by default; see placement.manual.coordinate_space]
  focus_pos: []              # Stimulation target position [T1 voxels by default; see placement.manual.coordinate_space]
  focal_distance_ep: []      # Focal depth setting: depth the device is set to focus at, from the exit plane [mm]; [] = trans_pos→focus_pos distance
  focal_distance_bowl: []    # Focal depth setting from the bowl apex [mm]
  focal_distance_offset: []  # Offset between bowl and exit plane [mm] [DERIVED]
  
  # --------------------------
  # Annular transducer parameters
  # --------------------------
  annular:
    elem_n: []            # Number of elements in the transducer [#]
    elem_id_mm: []        # Inner diameter of each element [mm]
    elem_od_mm: []        # Outer diameter of each element [mm]
    elem_p_amp: []          # Pressure amplitude [Pa]
    elem_phase_deg: []    # Source phase of each element [deg] (0-360)
    curv_radius_mm: []    # Radius of curvature of the bowl [mm]; .inf = flat element (plane piston; kWaveArray source only)
    dist_geom_ep_mm: []   # Distance from exit plane to geometric focus [mm]
    depth_mm: []          # Depth of transducer used for visualization purposes [mm]

  # --------------------------
  # Matrix transducer parameters
  # --------------------------
  matrix:
    elem_p_amp: []          # Pressure amplitude [Pa]
    steering: []          # '1D' (Axial steering) or '3D' (Volumetric steering)
    elem_shape: []        # 'rect', 'disc', or 'bowl' - physical shape of each element
    elem_height_mm: []    # Element height [mm]
    elem_width_mm: []     # Element width [mm]
    elem_diameter_mm: []  # Aperture diameter of 'disc'/'bowl' elements [mm]; [] = equal area to width x height
    elem_phase_override_deg: [] # Calibrated per-element phases [deg] replacing geometric steering; [] = steer geometrically to focus_pos
    use_steering_correction: true # Scale the drive by the library's steering correction k(target) (measured / modelled focal peak), when the library has one
    steering_correction: []   # Steering correction given inline (struct from build_steering_correction); [] = from the transducer library
    outer_diameter_mm: [] # Outer diameter of the transducer [mm]
    depth_mm: []          # Depth of transducer used for visualization purposes [mm]
    is_curved: []         # true if transducer has a curved (spherical) surface, false if flat (elements face +z; elem_shape rect or disc)
    curv_radius_mm: []    # Radius of curvature of the bowl [mm]
    dist_geom_ep_mm: []   # Distance from exit plane to geometric focus [mm]

    # Optional Clover multi-aperture configuration
    is_clover_setup: []  # true to enable Clover replication
    clover:
      n_leaves: []       # Number of leaves (>= 1)
      ROC_parent: []     # Radius of curvature of parent setup [mm]
      az_sep_deg: []     # Azimuthal separation between adjacent leaves [deg]; [] = 360 / n_leaves
      elevation_deg: []  # Leaf tilt from the parent axis [deg]; [] = smallest tilt without overlap (0 for one leaf)

    # --------------------------
    # Grid definition
    # --------------------------
    matrix_shape:
      type: []           # 'define_here' (define grid manually) or 'extract_from_file' (load positions from file)

      # If define_here is used:
      define_here:
        grid_shape:
          type: []       # 'rect', 'fibonacci', 'fermat' - type of grid layout

          rect:
            elem_n_row: []          # Number of rows in rectangular grid
            elem_n_col: []          # Number of columns in rectangular grid
            elem_spacing_height_mm: [] # Edge-to-edge spacing between rows [mm]
            elem_spacing_width_mm: []  # Edge-to-edge spacing between columns [mm]
            sparsity_factor: []     # Fraction of elements used (0 < value <= 1)

          fibonacci:
            elem_n: []             # Total number of elements for Fibonacci grid
            kerf_mm: []            # Minimum spacing between elements [mm]

          fermat:
            elem_n: []             # Total number of elements for Fermat spiral grid

      # If extract_from_file is used:
      extract_from_file:
        file_path: []              # Path to file with element positions (x, y, z) [string]
        start_row: []              # Row in file where element data starts
        start_col: []              # Column in file where element data starts
        rot_col: []                # Column with each element's rotation about its normal [deg] (e.g. 90 = rectangle turned on its side); [] = none
        elem_n: []                 # Total number of elements to extract
        select_random_subset: []   # true to randomly pick a subset
        subset:
          random_seed: []          # true to use a new seed each run, false to fix seed
          subset_n_elements: []    # Number of elements in the subset
        project_on_new_ROC: []     # true to project elements onto new ROC
        ROC_projection:
          new_ROC_mm: []           # New desired radius of curvature [mm]

#------------ Transducer Placement

placement:
  mode: 'manual'    # Placement mode: 'manual' (use trans_pos/focus_pos as provided) |
                    #   'localite' (derive from a recorded Localite pose; set placement.localite.file or path.localite_post/_raw) |
                    #   'heuristic' (sphere-expansion search; set placement.heuristic.mni_target_mm and target_name) |
                    #   'mni'       (define trans/focus directly in MNI mm; snapped to scalp + gap; set placement.mni.*) |
                    #   'plantus'   (multi-objective optimisation via external PlanTUS; set placement.plantus.*) |
                    #   'tus_entry' (flattest scalp contact via external TUS_entry (R); set placement.tus_entry.*)
  report: true      # Write a stand-alone placement report (sub-XXX_placement_<mode>.html in
                    #   io.dir_reports) after placement: target, positions, T1 overlay and, for
                    #   'plantus', the criteria evaluation (placement.plantus.evaluate).
  reuse: 'auto'     # Reuse a recorded heuristic/plantus/tus_entry run (placement_run.json in its run folder):
                    #   'auto'   reuse it when its settings match, else run the placement again |
                    #   'always' require it (mismatch handled per io.cache_signature_check) |
                    #   'never'  always run the placement. Independent of io.overwrite_files.
  manual:
    coordinate_space: 'voxel' # Space of transducer.trans_pos / focus_pos in mode='manual':
                              #   'voxel' (1-based T1 voxel indices) |
                              #   'ras'   (subject RAS+ mm of the T1; converted with ras_to_grid) |
                              #   'mni'   (MNI mm; transducer via the 12dof transform, focus via the
                              #            nonlinear warp; no scalp snapping, unlike mode='mni').
                              # ras/mni are converted to T1 voxels in the placement stage, per transducer.
  localite:
    enabled: 0        # Use Localite neuronavigation to position the transducer?
    # --- File mode: a single Localite XML file (TriggerMarkers, GUMMarkers or InstrumentMarker; type detected) ---
    file: ''          # Path to a single Localite XML file; leave empty for automatic mode
    # --- Automatic mode: ingested markers under path.localite_post (ingested from path.localite_raw on first use) ---
    session: 1        # Session: integer n (-> ses-0n) or 'ses-XX'
    target: ''        # Pick the series by target name (ingested name, or the XML description in file mode); '' = use position.
                      #   Multi-transducer: one name per transducer, e.g. [L_M1, R_M1] (transducer i uses entry i)
    position: 1       # Otherwise: index of the detected series (1-based, after the expected_segment_length filter); one per transducer allowed
    markertype: 'TriggerMarkers'  # DEPRECATED, ignored: the marker type is detected from the files
    # --- Ingestion (neuronav_ingest_markers / neuronav_gui) ---
    loc_folder: 'loc' # Folder between ses-XX/ and the Localite export; '' = export directly under ses-XX/
    session_folder_pattern: '*' # Wildcard a folder between loc_folder and the marker files must match (e.g. 'Session_2024*')
    expected_segment_length: 80 # Pulses per TriggerMarkers series; series off by more than 20 are dropped ([] = keep all)
    voxel_size: 0.9   # Only scales position_dev_vox in the series statistics [mm]
    # --- Shared ---
    reference_distance_mm: 15 # Fallback offset (mm) from Localite matrix origin to bowl rear centre (used by k-Wave makeBowl).
                              # Negative = bowl rear centre is on the housing side relative to the matrix origin.
                              # Only used when transducer geometry fields are absent and tracker_to_bowl_mm is not set.
    tracker_to_bowl_mm: []  # Explicit measured offset (mm) from the Localite 4×4 matrix origin to the bowl rear centre
                            # (the geometric axis point at the back of the housing; bowl_pos in k-Wave makeBowl).
                            # Negative = bowl rear centre is on the housing/tracker side (away from head).
                            # When set, overrides both the geometry-derived value and reference_distance_mm.
                            # See doc_placement_neuronav.md §"Localite matrix origin" for how to determine this value.
  heuristic:
    mni_target_mm: []    # [x y z] MNI coordinate of the sonication target (required for mode='heuristic')
    target_name: ''      # Label string for the target, used in output filenames (required for mode='heuristic')
    dist_close: []
    ear_radius: 35
    save_localite_t1: false # Save Localite-aligned T1 output for header correction?
    left_ear_center: []
    right_ear_center: []
    criterion_intersection: 0.05
    criterion_skin_mean: []
    criterion_skull_mean: []
    criterion_skin_var: []
    criterion_skull_var: []
    expand_step: 0.01
  mni:
    # Direct placement from MNI coordinates. The transducer point is snapped to the
    # nearest scalp voxel and offset outward by skin_gap_mm using the same geometry
    # as the heuristic; the focus is used as-is. Requires a SimNIBS m2m_sub-XXX folder.
    trans_pos_mm: []     # [x y z] desired transducer (scalp entry) position in MNI mm (required for mode='mni')
                         # Converted with the LINEAR (12dof) MNI->subject transform (it is outside the brain).
    focus_pos_mm: []     # [x y z] focus / target position in MNI mm (required for mode='mni')
                         # Converted with the NONLINEAR (nonl) transform, like the heuristic target.
    skin_gap_mm: 5       # standoff from scalp to transducer along the focal axis [mm]
                         # (default 5 = same gap as the heuristic placement)

  plantus:
    # --- Paths (required) ---
    script_path: ''           # Path to PlanTUS installation directory (must contain code/PlanTUS.py).
                              # Install from: https://github.com/mlueckel/PlanTUS
    env_path: ''      # Path to SimNIBS installation (must contain simnibs_env/bin/python).
                              # Typically the top-level SimNIBS directory, e.g. /opt/SimNIBS-4.1
    # --- Target (one of the two must be set) ---
    target_name: ''           # Label string for the target; used in output filenames (required)
    mni_target_mm: []         # [x y z] MNI coordinate of the sonication target [mm].
                              # If empty, transducer.focus_pos (voxel) is used instead.
    # --- Transducer characterisation (required) ---
    focal_distance_list: []   # [1×N] focal distances [mm] from calibration report.
                              # PlanTUS evaluates each distance as a candidate placement configuration.
    flhm_list: []             # [1×N] full-width at half-maximum focal length [mm] for each entry
                              # in focal_distance_list (same calibration report).
    # --- Geometry (optional; defaults derived from transducer equipment config) ---
    additional_offset_mm: 0   # Extra stand-off between skin and transducer exit plane [mm]
                              # (e.g., coupling gel pad or water-filled cone).
    max_angle_deg: 10         # Maximum allowed transducer tilt angle [degrees].
    min_distance_mm: []       # Skin–target distance window [mm] for eligibility; [] = min(focal_distance_list) - max(flhm_list).
    max_distance_mm: []       # [] = max(focal_distance_list) + max(flhm_list). Set both for a steerable array.
    optimal_distance_mm: []   # Optimum of the distance criterion [mm]; [] = mean(focal_distance_list).
    mask_radius_mm: 2         # Radius of the spherical target mask [mm].
    # --- Optimisation weights (must sum to 1.0) ---
    weight_skin_target_distances: 0.2     # Penalise transducer-to-target distance
    weight_skin_target_angles: 0.2        # Penalise beam angle at skin
    weight_skin_target_intersections: 0.2 # Reward beam-target volume overlap
    weight_skin_skull_angles: 0.2         # Penalise skin-skull surface angle
    weight_skull_thickness: 0.2           # Penalise skull thickness at entry
    # --- Outputs (optional) ---
    save_metrics: true        # Write per-vertex criteria, composite score and the placed vertex
                              # to <path.seg>/PlanTUS/sub-XXX/<target_name>/plantus_metrics.mat
                              # (headless and interactive; used by offline re-scoring/figures)
    evaluate: true            # Evaluate the placement from plantus_metrics.mat: criterion values
                              # and percentiles at the placed spot, a weight sweep, diagnostics and
                              # two figures (plantus_evaluation.json/.csv/.png, ~10 s). Shown in the
                              # placement report (placement.report). Needs save_metrics.
    # --- Surface visualisation (optional) ---
    interactive: []           # Choose the vertex in Connectome Workbench (1) or automatically (0);
                              # [] = follow simulation.interactive. 1 works without the MATLAB desktop
                              # (e.g. from the Nexus) but needs a display; without one PlanTUS runs headless.
    connectome_wb_path: ''    # Connectome Workbench bin/ (wb_command, wb_view); prepended to PATH.
                              # Empty = wb_command must be on PATH or in the Python env's bin/ (checked at start).
                              # wb_view is only opened in interactive mode.

#------------ Neuronavigation (Localite ingestion)

neuronav:
  coil_map: []      # Multi-coil ingestion: one entry per coil, e.g.
                    #   - coil: 0                 # hardware coil index (TriggerMarkers_Coil<N>)
                    #     target: 'L_M1'          # one recorded block, or:
                    #     sequences: [{target: 'R_M1'}, {target: 'R_M1'}]   # several blocks
                    # [] = single-coil ingestion (Coil0, GUMMarkers fallback)
  # --- Target naming (neuronav_name_series; same rule in neuronav_gui and neuronav_ingest_batch) ---
  suggest_names: true       # Name series after the planned target (EntryTarget / GUMMarkers) nearest their beam axis
  axis_tolerance_mm: 10     # Max. distance of that target from the beam axis [mm]
  target_depth_mm: [0, 150] # Accepted target depth along the beam axis [mm]
  target_labels: []         # Label map: planned-target labels as recorded -> study target names, e.g.
                            #   - target: 'L_V1'
                            #     labels: ['LEFT V1', 'L_V*']   # wildcards * ?, case-insensitive
                            # [] = use the labels as found (list them with neuronav_scan_sessions)
  batch_write: 'all'        # neuronav_ingest_batch: 'all' tracked series, or only 'named' ones

#------------ Simulation grid

grid:
  resolution_mm: 0.5  # Grid resolution (must be isotropic) [mm]
  default_dims: 'auto'          # [points per dimension] [used for setting up free-water grid]; 'auto' = sized to the transducer:
                                #   aperture + 2 x water_margin_mm laterally, focal distance (bowl) + z_beyond_focus_mm axially.
                                #   Same free-water ISPPA and focus as [144, 144, 400] (k-Wave drive benchmark, 2026-10).
                                #   A matrix transducer placed by trans_pos/focus_pos (grid indices) keeps [144, 144, 400].
  # water_margin_mm: 5      # Lateral margin on each side of the aperture when default_dims='auto' [mm].
  # z_beyond_focus_mm: 40   # Extra axial length beyond the focal depth when acoustic_fov_length_mm='auto' or default_dims='auto' [mm].
  #                          # Default 40 mm, matching BabelBrain conventions.  Override to extend or
  #                          # shorten the acoustic-only sub-grid along the beam axis.
  # acoustic_fov_diameter_mm: []  # Lateral diameter of the beam-axis-aligned acoustic sub-grid [mm].
  #                               # 'auto' → outermost element diameter of transducer(1).
  #                               # Set to a number to restrict the acoustic sim to a smaller lateral FOV.
  # acoustic_fov_length_mm: []    # Axial length of the acoustic sub-grid [mm].
  #                               # 'auto' → focal_depth + z_beyond_focus_mm.
  # thermal_use_acoustic_fov: 0   # 1 = thermal simulation also runs within the acoustic FOV (faster,
  #                               # less accurate cooling boundary). 0 = thermal uses the full grid (default).
  # thermal_resolution_mm: []     # Override grid resolution for thermal simulation only [mm].
  #                               # Leave empty to reuse the acoustic grid resolution.
  # thermal_fov_mm: []            # Independent thermal FOV [mm]; defines a sub-grid around the focus
  #                               # for the thermal solver, independent of the acoustic FOV.
  # pml_size_range: [10, 40]  # Search range [min, max] of 'auto' pml_size [grid points] (k-Wave default)
  # pml_alpha: []              # PML absorption [Nepers per grid point]; empty: k-Wave default (2)
  pml_size: 'auto'    # Perfectly Matched Layer (PML) thickness [grid points] or 'auto'.
                      # 'auto': calls getOptimalPMLSize(kgrid) which searches the range [10, 40]
                      #   and picks the size that minimises the largest prime factor of
                      #   grid_N + 2*pml_size (independently per dimension), maximising FFT speed.
                      #   For axisymmetric mode the radial dimension uses the WSWA variant.
                      # Integer (e.g. 20): fixed thickness; may slow FFT if grid_N + 2*pml_size
                      #   has large prime factors.
  water_baseline_grid: 'beam' # Grid of the k-Wave free-water baseline: 'beam' (box around the source and beam: same free-field result, a fraction of the cost) | 'full' (the whole simulation grid)
  source_ppw: []      # Points Per Wavelength [default: calculated internally]
  min_ppw: 6          # Minimum acceptable PPW at the fundamental frequency; triggers a warning if violated
  source_cfl: 0.15    # Courant-Friedrichs-Lewy fraction
  source_limit_fraction: 0.9 # Fraction of the stability limit to use for time step (0 = do not use stability limit)
  # steady_state_transits: 1       # Number of domain-diagonal one-way transits (at min. sound speed) before
  #                                 # recording starts. Default 1. Compact, highly reflective domains (e.g. a
  #                                 # partial-FOV crop with a high skull/water impedance mismatch) may need more
  #                                 # transits for multiply-reflected energy to decay to true periodic steady
  #                                 # state — jwave's own cross-validation test uses roundtrips=20.
  # steady_state_num_periods: 3    # Number of trailing wave periods recorded as the steady-state window.
  #                                 # Default 3. Increase together with steady_state_transits if Isppa/focal
  #                                 # depth are still drifting as either is increased (a converged setup should
  #                                 # stop changing further).
  # source_ppp: []                 # Time steps per wave period; when set, replaces the PPW/CFL derivation
  #                                 # (dt = period / source_ppp), e.g. to match a reference simulation.
  # sim_time_us: []                # Fixed simulation duration [us]; when set, replaces steady_state_transits.
  max_expand: 40      # Prime number grid expansion size to (potentially) speed up computations
  use_kWaveArray: 1   # Use the kwaveArray class for transducer modeling?
  # bli_tolerance: []        # kWaveArray band-limited interpolation tolerance; empty: 0.1 (3D), 0.01 (axisymmetric)
  # bli_upsampling_rate: []  # kWaveArray integration-point upsampling; empty: 10 (3D), 100 (axisymmetric)
  axisymmetric: 0     # Use 2D axisymmetric simulation mode?
  axisymmetric_output: 'auto' # Axisymmetric results: 'auto' (3D for phantoms or with heating, else the 2D plane),
                              # '2d' (mirrored plane; no heating), '3d' (always expand)
  mode: 'focal_axis'       # Grid orientation mode:
                           #   'focal_axis' (default) — rotate volume so the mean beam axis of
                           #     all transducers aligns with z, averaging the beams as axes (a beam
                           #     pointing against transducer(1)'s is reversed first). For N=1 this
                           #     equals transducer_axis; same-side beams give their bisector;
                           #     opposed (bilateral) beams give the bisector of their axes, each
                           #     beam tilted by about half the angle between them. Falls back to
                           #     transducer(1)'s axis if the axes are too spread (norm <
                           #     grid.focal_axis_min_norm; only possible with 3+ transducers).
                           #   'transducer_axis' — rotate volume so the focal axis of
                           #     transducer(1) aligns with z. Compact grid, z-aligned beam.
                           #     Useful when transducer(1) is the primary beam and other
                           #     transducers are secondary/passive.
                           #   'ras_plus' — keep volume in RAS+ orientation; no rotation applied,
                           #     only isotropic rescaling, so every beam is oblique to the grid.
                           #     Not compatible with grid.axisymmetric.

#------------ Segmentation

segmentation:
  use_qform: 0      # Force qform reorientation before charm segmentation? Set to 1 if charm reports qform/sform mismatch.
  debug: 0          # Pass --debug flag to charm segmentation for verbose output?

#------------ Head model processing

headmodel:
  head_pad_mm: 0      # Symmetric padding applied to the cropped head grid prior to transducer + PML setup [mm]
  csf_expansion: 40   # Dilation of the CSF brain mask into surrounding head regions [mm]; converted to voxels at grid.resolution_mm
  # Thresholds for smoothing masks (and acoustic properties)
  smooth_method: 'gaussian' # Filter type ['gaussian' (default)|'box']
  smooth_threshold_skull: 0.5 # (higher threshold -> thinner mask)
  smooth_threshold_other: 0.5 # (higher threshold -> thinner mask)
  smooth_fwhm_mm: 1   # Smoothing FWHM [mm]
  smooth_properties: false # Apply smoothing with parameters above to acoustic property maps?
  # Settings for skull hole-filling
  skull_fill_method: 'rubberwrap' # Method for filling holes in the skull ['rubberwrap'(default)/'imclose']
  skull_wrap_radius: 10 # Rubber-wrap radius [grid voxels]; larger = tighter rubber ignoring bigger dents (recommendation: 2–10)
  skull_wrap_visualize: 0 # Visualize rubber-wrap result? (Currently causes issues on HPC)
  reuse_across_placements: false # Build the smoothed head model once per subject (unrotated, at grid.resolution_mm; <dir_cache>/sub-XXX_<medium>_headmodel_<res>mm.mat) and only rotate and crop it for each transducer placement

#------------ (pseudo-)CT skull property mapping

pct:
  enabled: 0                    # Use (p)CT (if available) to inform skull medium properties
  skull_mapping: 'kosciessa'    # UTE→HU linear mapping algorithm: miscouridou/carpino/wiesinger/treeby/kosciessa/custom
  custom_slope: []              # skull_mapping 'custom': HU = custom_slope * normalised UTE + custom_intercept
  custom_intercept: []          # (skull voxels; soft tissue 42 HU, air -1000 HU as for the other mappings)
  debug: 1                      # Keep intermediate images in pseudoCT/ subfolder (0 to delete)
  mapping_density: 'k-plan'     # pCT mapping algorithm for density: k-plan/k-wave/marsac/aubry/air-tissue
  density_calibration: ''       # HU->density table for mapping_density 'k-plan'. HU depend on scanner, kVp and kernel, so use the
                                #   table of the CT the UTE->HU line was fitted to: '' = k-Plan default (kplan_default),
                                #   a table in config/ct_calibration/ by name ('ucl_lowdose_80kvp' for treeby, 'cph2025'),
                                #   or a CSV path (two columns: HU, density [kg/m^3]; # comments)
  mapping_soundspeed: 'k-plan'  # pCT mapping algorithm for sound speed: k-plan/marsac/aubry/webb/pichardo/mcdannold
  mapping_attenuation: 'k-plan' # pCT mapping algorithm for attenuation: k-plan/mueller/aubry/webb/pichardo/mcdannold

#------------ Simulation layers
# Assign tissue compartments to model, with their SimNIBS segmentation label indices.
# You can remove or add layers. If you want a skull-only simulation, remove brain and skin for example.

layers:
  water: [0, 3, 6, 9, 10] # this isn't really neccessary as water is a default layer - all that has a number not used for other layers will be assigned water properties
  brain: [1, 2]
  skin: [5]
  skull: [4]
  skull_cortical: [7]
  skull_trabecular: [8]

#------------ Sonication timing protocol (no defaults - must be specified for thermal simulations)

timing:
  pd: 0            # Pulse Duration (PD) [s]
  pri: 0           # Pulse Repetition Interval (PRI) [s]; PRF = 1/pri
  ptd: 0           # Pulse Train Duration (PTD) [s]
  pt_timestep: 0.02   # Modelling time step within a pulse train [s]
  ptri: 0          # Pulse Train Repetition Interval (PTRI) [s]
  ptrd: 0          # Pulse Train Repetition Duration (PTRD) [s]
  post_ptri_dur: 0 # Post-PTRI steady-state duration [s]
  post_pt_timestep: 1 # Modelling time step following PT & PTRI [s]
  equal_step_duration: 0 # Equal step durations for on and off cycles? 1=yes, 0=no

#------------ Thermal parameters

thermal:
  cem43_iso: 0 # CEM43 form used in the HTML report: 1 = ISO 14708-3 / ITRUSST, 0 = k-Wave kWaveDiffusion. Both are always computed and saved (see doc_simulations-thermal.md)
  temp_0: #[deg C] initial temperature
    water: 37
    skull: 37
    brain: 37
    skin: 37
    skull_trabecular: 37
    skull_cortical: 37
  sensor_xy_halfsize: 100 # maximum size of the sensor window in which the temperature is recorded (in grid units)
  record_t_at_every_step: 0 # should we record temperature for every time step _for the whole sensor window_ (memory intensive, turn off if you experience 'out of memory' issues)
  log_thermal_updates: 0    # show verbose k-Wave thermal output for every time step; if 0, only the first step is shown in full and subsequent steps are silent

#------------ Time reversal (reciprocity): refocusing phases, aberration metrics, pose search (see doc_time_reversal.md)
# One extra k-Wave run per target with a point source at the target, before the acoustic simulation.
time_reversal:
  enabled: false            # Run the reverse simulation and write the refocusing / aberration report
  apply_phases: false       # Use the time-reversal phases in the acoustic run (matrix: per element; annular: per ring; ignored for a single element)
  save_field: false         # Also save the reverse field (sensor region, complex) in <dir_cache>/<prefix>_timereversal.mat
  placement_search:
    enabled: false          # Score transducer poses around the planned one on the same reverse run (curved annular, 3D); suggestions only
    max_angle_deg: 20       # Largest tilt of the beam direction from the planned one (orbit around the target) [deg]
    angle_step_deg: 2.5     # Angular step of the candidate directions [deg]
    standoff_mm: []         # Scalp to exit-plane distance [mm]; [] = that of the planned pose
    aim_iterations: 2       # Aberration-corrected aim: re-aim at target - predicted shift this many times (0 = geometric aim only)
    jitter_mm: []           # Also score the planned pose with its apex moved by these distances [mm], aimed at the target (e.g. [0.5 1 2 5]); [] = none
    jitter_mode: 'grid'     # How jitter_mm moves the apex: 'grid' (+- along each grid axis, as when editing voxel coordinates; 6 poses per distance) | 'scalp' (slid over the scalp perpendicular to the beam in 8 directions, re-seated against the scalp; 8 poses per distance)
  only: false               # Stop after the time-reversal stage: no water baseline, acoustic or thermal simulation
  pose_workflow:            # Search -> forward verification -> final full-grid run, in one call (one curved annular transducer, layered medium)
    enabled: false          # Run the pose workflow instead of a single simulation (doc_time_reversal.md#pose-workflow)
    n_top: 5                # Verify the n_top best poses by predicted target pressure (plus the planned pose as reference)
    poses: []               # Also verify these pose ids of the pose table
    aim: 'corrected'        # Aim of the verification runs: 'corrected' (aberration-corrected aim point) | 'geometric' (at the target) | 'both'
    verify_fov: 'partial'   # Grid of the verification runs: 'partial' (acoustic FOV, 'auto' sizes unless set) | 'full' | 'config' (as configured)
    target_radius_mm: 2     # Radius of the target sphere over which the simulated intensity is averaged [mm]
    rank_by: 'target_intensity'  # Choose the best pose by 'target_intensity' (highest) | 'focus_error' (smallest -3 dB centroid to target distance)
    max_focus_error_mm: []  # Only poses whose -3 dB centroid lies within this distance of the target qualify [mm]; [] = no limit
    final_run: true         # Run the best pose on the full grid, with the configured modules (e.g. thermal)
    search_memorylimit: []  # hpc.memorylimit of the search run [GB] (records the field over all candidate poses); [] = hpc.memorylimit

#------------ jwave solver settings (used when acoustic_backend = 'jwave'; see doc_jwave.md)
jwave:
  python_env: ''            # Path to Python environment or executable; empty = system python
  python_env_gpu: ''        # Path to GPU-capable Python environment; empty = same as python_env
  use_gpu: ~                # Use GPU acceleration: true | false | ~ (auto-detect)
  solver: helmholtz         # 'helmholtz' (frequency-domain GMRES) | 'pseudo_spectral' (time-domain, as kspaceFirstOrder*) | 'finite_differences' (time-domain, FD stencils)
  fd_accuracy: 8            # FD stencil order; finite_differences only
  # PML thickness is set by grid.pml_size (shared with k-Wave; jwave resolves 'auto' to ~2.5 wavelengths)
  gmres_restart: 10         # GMRES restart parameter (Krylov subspace size); jwave's own default. Larger values can destabilise GMRES in single precision
  gmres_maxiter: 1000       # Maximum GMRES iterations; jwave's own default
  gmres_tol: 1.0e-3         # GMRES convergence tolerance; jwave's own default
  convergence_threshold: 0.05         # Relative Helmholtz residual above which the run errors
  ignore_convergence_threshold: false # true: a residual above convergence_threshold only warns and the unconverged result is returned
  helmholtz_operator: conservative  # Helmholtz density term: 'conservative' (rho*div((1/rho) grad p), local-c source scaling) | 'jwave' (jwave's built-in term; ~20 % low through skull)
  precision: single         # Computational precision: 'single' | 'double'
  dry_run: false            # Write the HDF5 solver inputs only; the pipeline stops after the acoustic stage and caches nothing
  cleanup_cache: true       # Delete the HDF5 solver input from the cache after a successful run (rewritten every run); set false to keep it for debugging

#------------ Elastic (shear-wave) skull model (used when acoustic_backend = 'kwave_elastic'; see doc_kwave.md)
# Applied to the skull layers (skull, skull_cortical, skull_trabecular). Attenuations are power laws
# a*f^y [dB/(cm MHz^y)], converted to the solver's y = 2 law so the value at the source frequency is exact.
elastic:
  shear_mapping: 'pichardo'   # Skull shear speed: 'pichardo' (cS = a(f)*rho + b(f); Pichardo et al. 2017 fits at 270 / 836 kHz, interpolated to the transducer frequency; uses layer densities without pCT) | 'off' (cS = 0: fluid skull through the elastic solver)
  shear_density_min: 1200     # No shear support at or below this density [kg/m3]
  poisson_min: 0.1            # Cap cS so the Poisson ratio stays >= this value (bone: ~0.2-0.35)
  alpha_coeff_shear: 43.63    # Shear attenuation [dB/(cm MHz^y)]; power law through Pichardo et al. 2017 (57 Np/m @ 270 kHz, 373 Np/m @ 836 kHz)
  alpha_power_shear: 1.662    # Shear attenuation power law exponent
  alpha_coeff_long: 27.31     # Skull longitudinal attenuation for elastic runs [dB/(cm MHz^y)]; power law through the values Pichardo et al. 2017 paired with their shear fit (33 Np/m @ 270 kHz, 231 Np/m @ 836 kHz)
  alpha_power_long: 1.722     # Longitudinal attenuation power law exponent
  long_attenuation: 'elastic' # Skull longitudinal attenuation: 'elastic' (alpha_coeff_long) | 'medium' (keep the fluid/pCT skull alpha_coeff, which already includes effective shear losses)
  min_ppw_shear: 6            # Warn when the slowest shear wave has fewer points per wavelength

#------------ BabelBrain solver settings (used when acoustic_backend / thermal_backend = 'babelbrain'; see doc_babelbrain.md)
babelbrain:
  computing_backend: auto   # GPU/CPU backend: 'auto' | 'cuda' | 'opencl' | 'metal' | 'cpu' (or 1-4); thermal has no CPU backend
  device_name: auto         # Device to use: 'auto' selects the first available
  ppw: 12                   # Points-per-wavelength for BabelBrain's internal FDTD grid (BabelViscoFDTD benchmark fidelity; lower = faster but more axial numerical dispersion)
  do_refocusing: false      # Apply BabelBrain refocusing step
  focal_calibration: true           # Geometric-fallback steering only (no explicit element phases): choose the steer so the achieved FWHM-centre (or peak) lands at focal_distance_ep. With explicit phases this runs locate-only (reports the predicted focus, never replaces the drive). Set false to disable.
  focal_calibration_target: flhm_center  # Quantity placed at focal_distance_ep: 'flhm_center' (−3 dB axial midpoint; manufacturer convention) | 'peak'
  profile_calibration: false        # Optional refinement (annular explicit-phase drives only): re-fit the BabelBrain drive phases so the discrete-ring Rayleigh field matches the continuous-bowl O'Neil ideal across the WHOLE axial profile (not just the FWHM centre). BabelBrain-specific (only the weights delta uses it; shared library phases for k-Wave/jwave are untouched). OFF by default: once the delta is referenced to the correct steering aim (focal_distance_ep), BabelBrain already reproduces the library phases, matching the k-Wave/jwave cluster; this fit targets the continuous-bowl ideal, which sits slightly distal of that cluster.
  water_amp_calibration: true       # Scale BabelBrain output pressure so its free-water peak matches the analytic Rayleigh peak for the same drive (calibrates out BabelBrain's residual CFL-correction amplitude bias; requires explicit element phases)
  use_rayleigh_for_water: false     # Water-only field solver. false: full-wave FDTD (matches k-Wave/jwave for like-for-like backend comparison; recommended). true: BabelBrain's native Rayleigh–Sommerfeld integral (faster, exact linear free-field, but focuses slightly tighter/deeper than a gridded full-wave solve → reads as a rigid axial offset + higher peak vs the other backends). Only affects water-only runs; the transcranial field always uses FDTD.
  q_correction: []                 # Bone Q-factor correction of BabelBrain's relaxation attenuation model (its QCorrection). [] = 1.0 on the non-CT path (realises the specified bone alpha_coeff), BabelBrain's 3.0 on the CT path. Realised bone attenuation scales ~1/Q; values > 0 override both paths.
  z_beyond_focus_mm: 40     # How far beyond the focus to extend the simulation domain [mm]
  python_env: ''            # Path to Python environment or executable; empty = system python
  ct_mapping: ''            # CT Hounsfield-to-property mapping name for CT-based skull modelling; empty = label-based path
  air_regions: false        # pseudoCT path only (ct_mapping set): internal air (sinuses, mastoid) as BabelBrain's pressure-release reflector mask
  air_hu_window: [-1200, -400] # HU range classified as air for air_regions
  air_keep_boundary: false  # Keep air components touching the domain boundary (default: removed with the exterior air)
  cleanup_cache: true       # Delete per-subject BabelBrain cache dir after reading output; set false to keep HDF5/NIfTI files for debugging
  dry_run: false            # Prepare the BabelBrain inputs only; the pipeline stops after the acoustic stage and caches nothing

#------------  Medium properties
# References: ITRUSST benchmarks (https://arxiv.org/abs/2202.04552); Tissue Properties DB (https://itis.swiss/virtual-population/tissue-properties/overview/);
# Note: skull attenuation and absorption values remain uncertain, use defaults with caution!
# Absorption (heat deposition): each tissue sets either absorption_fraction (of the attenuation)
# or absorption_coeff [dB/(cm MHz^y)], y = alpha_power. A config layer that sets one clears the
# other inherited from earlier layers; setting both in one layer errors.
medium_properties:
  water:
    sound_speed: 1500
    density: 994
    alpha_coeff: 2.17e-3
    alpha_power: 2
    thermal_conductivity: 0.60 # [W/m/°C]
    specific_heat_capacity: 4178 # [J/kg/°C]
    perfusion: 0
    absorption_fraction: 1
    absorption_coeff: [] # [dB/(cm MHz^y)]; alternative to absorption_fraction, e.g. 2.17e-3 (= alpha_coeff)
  brain:
    sound_speed: 1546 # [m/s]
    density: 1046 # [kg/m^3]
    alpha_coeff: 0.59
    alpha_power: 1.2
    thermal_conductivity: 0.51 # [W/m/°C]
    specific_heat_capacity: 3630 # [J/kg/°C]
    perfusion: 559
    absorption_fraction: 1
    absorption_coeff: [] # [dB/(cm MHz^y)]; alternative to absorption_fraction, e.g. 0.59 (= alpha_coeff, conservative); measured brain absorption is lower (~0.05-0.16 dB/cm at 500 kHz)
  skin:
    sound_speed: 1610 # [m/s]
    density: 1090 # [kg/m^3]
    alpha_coeff: 0.4
    alpha_power: 1
    thermal_conductivity: 0.37 # [W/m/°C]
    specific_heat_capacity: 3391 # [J/kg/°C]
    perfusion: 106
    absorption_fraction: 1
    absorption_coeff: [] # [dB/(cm MHz^y)]; alternative to absorption_fraction, e.g. 0.4 (= alpha_coeff)
  skull: # (single skull layer only; mostly following cortical bone)
    sound_speed: 2800 # [m/s]
    density: 1850 # [kg/m^3]
    alpha_coeff: 13.3
    alpha_power: 1
    thermal_conductivity: 0.32 # [W/m/°C]
    specific_heat_capacity: 1793 # [J/kg/°C]
    perfusion: 20
    absorption_fraction: 0.28
    absorption_coeff: [] # [dB/(cm MHz^y)]; alternative to absorption_fraction, e.g. 3.78: longitudinal + 0.2 x shear absorption (2.7 + 0.2 x 5.4; Pinton et al., 2012)
  skull_trabecular: # trabecular bone
    sound_speed: 2300 # [m/s]
    density: 1700 # [kg/m^3]
    alpha_coeff: 13.3
    alpha_power: 1
    thermal_conductivity: 0.32 # [W/m/°C]
    specific_heat_capacity: 2274 # [J/kg/°C]
    perfusion: 30
    absorption_fraction: 0.28
    absorption_coeff: [] # [dB/(cm MHz^y)]; alternative to absorption_fraction, e.g. 3.78: longitudinal + 0.2 x shear absorption (2.7 + 0.2 x 5.4; Pinton et al., 2012)
  skull_cortical: # cortical bone
