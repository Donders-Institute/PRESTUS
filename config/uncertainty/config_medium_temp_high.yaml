# Temp-H: medium properties that maximise brain heating (uncertainty variant temp_high).
#
# Per property, the bound that raised brain heating in the ITRUSST one-at-a-time sweep. Heating
# runs; the acoustic results of this variant do not bound intensity (see config_medium_trans_high).
#
# Brain and skull values: lower (LOW) or upper (HIGH) bound of each property in the ITRUSST
# tissue property table (PRESTUS_itrusst data/tissue_parameters.csv and tissue_setups.csv;
# sources in data/tissue_parameters_source.md). Attenuation and absorption are 1 MHz
# coefficients with y = 1 (alpha_coeff = alpha_500kHz / 0.5). The single skull bound is used
# for all skull compartments. Tissues and properties not listed keep the default medium.

medium_properties:
  brain:
    sound_speed: 1573
    density: 1040
    alpha_coeff: 0.984
    alpha_power: 1
    thermal_conductivity: 0.48
    specific_heat_capacity: 3525
    perfusion: 196
    absorption_fraction: 1
  skull:
    sound_speed: 2871
    density: 1080
    alpha_coeff: 8.04
    alpha_power: 1
    thermal_conductivity: 0.30
    specific_heat_capacity: 826
    perfusion: 0
    absorption_coeff: 8.04
  skull_trabecular:
    sound_speed: 2871
    density: 1080
    alpha_coeff: 8.04
    alpha_power: 1
    thermal_conductivity: 0.30
    specific_heat_capacity: 826
    perfusion: 0
    absorption_coeff: 8.04
  skull_cortical:
    sound_speed: 2871
    density: 1080
    alpha_coeff: 8.04
    alpha_power: 1
    thermal_conductivity: 0.30
    specific_heat_capacity: 826
    perfusion: 0
    absorption_coeff: 8.04
