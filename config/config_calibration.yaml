# The configuration is structured using YAML (https://yaml.org/). Note that YAML uses spaces, not tabs, for identation.

  ## Parameters for standalone calibration (using Donders equipment)

  # Simulation paths (no defaults; change to your directories...)
  path_input_axial: ''  # Base path for axial profiles (set in your site wrapper or leave '' for absolute paths)

  # List combinations of setups (e.g., transducer-TPO) and calibration targets (no defaults)
  # Every [] specification will be performed for the corresponding (ordered) index equipment combination. 
  # Example: all foci within the first [] will be executed for the first equipment combination. 
  # If array is empty ([]), all focal depths of available characterization data will be used.

  combinations:                             # Equipment combinations
    - IS_PCD15287_01001_IGT_32_ch_comb_10_ch
    - IS_PCD15473_01001_IGT_32_ch_comb_10_ch
  focal_depths_wrt_exit_plane:              # List of focal depths (in mm) to be characterized.
    - [37, 58]
    - [37, 58]
  desired_intensities:                      # Desired intensities in W/cm^2       
    - [35, 83]
    - [35, 83]

  # For curved transducers: are distances in empirical profiles provided from the exit plane?
  add_FDO: 1   # Append Focal Distance Offset (distance from transducer bowl to exit plane). Use if zero point in provided profiles = exit plane, != transducer bowl.

  ## Parameters for calibration function

  # I/O — two endpoints: the library entry and the calibration output folder
  path_output: '/project/2425122.01/calibration/data/calibration/'                          # Working folder (k-Wave drive calibration, HPC logs) [Change to your directories...]
  library_path: ''                  # Library endpoint: {library_path}/{combo}.yaml, used by studies via transducer.library_path ('' = {path_output}/library)
  path_output_profiles: '/project/2425122.01/calibration/data/PRESTUS_virtual_parameters/'  # Calibration output folder: phases/amplitude per depth x intensity (CSV + YAML), settings, profiles, report, figure ('' = {path_output}/profiles)
  filename_calibrated_CSV: ''       # Filename of the phase/amplitude CSV table ('' = PRESTUS_virtual_{combo}.csv)

  # Calibration (the same core as build_transducer_library / refine_transducer_library)
  phase_mode: 'single_depth'        # 'single_depth' (default): fit each requested depth | 'geometric': no fit, geometric steering with the measured drive
  fit_preset: 'rayleigh_phase_gain' # 'rayleigh_phase_gain': per-ring phase + gain, Rayleigh model, robust intensity loss | 'oneil_phase_only': former global-search behaviour (O'Neil model, opt_method optimiser, phases only)
  # forward_model: 'rayleigh'       # Optional override of the preset's forward model: 'rayleigh' | 'oneil'
  # fit_options: {}                 # Optional fit_transducer_model options on top of the preset (e.g. {NStarts: 32})
  opt_phase_precession: false       # false (default) | 'linear' (phase ramp, 2 params) | 'monotonic' (ordered phases via cumulative increments)
  opt_weights: 0                    # 0 = uniform weighting; >= 1 increasingly narrow Gaussian weights around the focus
  # opt_limits: []                  # [min max] axial window compared in the fit [mm from the bowl apex] (default: whole profile beyond skip_front_peak_mm)
  skip_front_peak_mm: 10            # Near field ignored in the fit and the metrics [mm from the exit plane]

  # Within-ring velocity profile (fit_ring_profile): each ring split into sub-rings with weights shared by all
  # depths, for transducers whose near-field / focal peak ratio uniform rings cannot reproduce (e.g. CTX).
  # On axial profiles only, the off-axis field it implies is not validated: add plane scans (ring_profile_offaxis).
  ring_profile: 'auto'              # 'auto' (keep the library entry's, if any) | 'fit' (all measured depths) | 'none' (uniform rings)
  ring_profile_n_sub: 4             # Sub-rings per ring
  ring_profile_smooth: 0.3          # Smoothness penalty between neighbouring sub-rings (0 = none; larger = closer to uniform)
  ring_profile_near_field_skip_mm: 4  # Near field ignored [mm from the exit plane]; the per-depth fits then use the same range
  ring_profile_offaxis: ''          # Plane scans fitted with the axial profiles (read_offaxis_scans): FUS Metrology export (.mat/folder/.zip) or CSV; '' = axial only
  ring_profile_offaxis_kind: 'all'  # Planes used: 'all' | 'transverse' (XY) | 'axial' (XZ / YZ)

  # Unmeasured depths: interpolate the neighbouring measured profiles, then fit
  profile_align: 'label'            # Focus alignment when interpolating profiles to an unmeasured depth: 'label' (column focal-depth headers, default) | 'peak' (intensity peak beyond skip_front_peak_mm)
  max_extrapolation_mm: 0           # Desired depths up to this far outside the measured range use the nearest profile shifted to the desired depth (mm); 0 = no extrapolation
  max_gap_mm: 10                    # Warn when a depth is interpolated between measured depths further apart than this (mm)

  # Free-water k-Wave drive calibration per calibrated depth: rescales the stored drive to the simulated ISPPA
  # and reports the agreement with the measured profile; phases unchanged
  kwave_drive_calibration: true     # Run it? (former name: run_free_water_sim, still read)
  force_kwavearray: 1               # Simulate with kWaveArray?
  axisymmetric2D: 0                 # 2D axisymmetric grid instead of 3D: ~1 min per depth, drive within ~3 % ISPPA of 3D (doc_transducer_library.md)
  kwave_grid_dims: []               # Free-water grid: [] = grid.default_dims of the simulation config | 'auto' = sized to the aperture and focus (water_grid_dims) | [Nx Ny Nz]

  # oneil_phase_only preset only
  opt_method: 'FEXminimize'         # 'FEXminimize' (open source subtoolbox) | 'GlobalSearch' (MATLAB's Global Optimization Toolbox)
  opt_seed: 251024                  # Random seed for the optimiser
