# The PRESTUS Nexus environment, in one step (run in this folder):
#   conda env create -f environment.yml
# Update an existing one after this file or pyproject.toml changed:
#   conda env update -n prestus-nexus -f environment.yml
#
# The packages are listed once, in pyproject.toml, and installed with pip. Qt comes
# from pip as well: PyQt6 and PyQt6-WebEngine must come from the same source (conda's
# pyqt with pip's PyQt6-WebEngine fails to load), and conda-forge has no Qt6 WebEngine.
name: prestus-nexus
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -e .[test]
