  thermal.ptd: {use: timing.ptd, kind: rename, since: v0.6.0}
  thermal.pt_timestep: {use: timing.pt_timestep, kind: rename, since: v0.6.0}
  thermal.ptri: {use: timing.ptri, kind: rename, since: v0.6.0}
  thermal.ptrd: {use: timing.ptrd, kind: rename, since: v0.6.0}
  thermal.post_ptri_dur: {use: timing.post_ptri_dur, kind: rename, since: v0.6.0}
  thermal.post_pt_timestep: {use: timing.post_pt_timestep, kind: rename, since: v0.6.0}
  thermal.equal_step_duration: {use: timing.equal_step_duration, kind: rename, since: v0.6.0}
  transducer.n_elements: {use: transducer.annular.elem_n, kind: rename, since: v0.6.0}
  transducer.Elements_ID_mm: {use: transducer.annular.elem_id_mm, kind: rename, since: v0.6.0}
  transducer.Elements_OD_mm: {use: transducer.annular.elem_od_mm, kind: rename, since: v0.6.0}
  transducer.curv_radius_mm: {use: transducer.annular.curv_radius_mm, kind: rename, since: v0.6.0}
  transducer.dist_to_plane_mm: {use: transducer.annular.dist_geom_ep_mm, kind: rename, since: v0.6.0}
  transducer.source_amp: {use: transducer.annular.elem_p_amp, kind: rename, since: v0.6.0}
  transducer.source_phase_deg: {use: transducer.annular.elem_phase_deg, kind: rename, since: v0.6.0}
  transducer.source_phase_rad: {use: transducer.annular.elem_phase_rad, kind: rename, since: v0.6.0}
  transducer.source_freq_hz: {use: transducer.freq_hz, kind: rename, since: v0.6.0}
  transducer.set_intensity_w_per_cm2: {use: transducer.tx_calibration.isppa_wcm2, kind: rename, since: v0.6.0}
  transducer.set_focus_wrt_exit_plane_mm: {use: [], kind: removed, since: v0.6.0, note: "informational field of v0.5.0 calibration files; set transducer.focal_distance_ep"}
  transducer.expected_focal_distance_mm: {use: [transducer.focal_distance_ep, transducer.focal_distance_bowl], kind: error, since: v0.6.0, note: "v0.5.0 read this distance from the bowl apex in most code paths and from the exit plane in others; set transducer.focal_distance_ep or transducer.focal_distance_bowl"}
  expected_focal_distance_mm: {use: [transducer.focal_distance_ep, transducer.focal_distance_bowl], kind: error, since: v0.6.0, note: "v0.5.0 read this distance from the bowl apex in most code paths and from the exit plane in others; set transducer.focal_distance_ep or transducer.focal_distance_bowl"}
  expected_focal_distance_EP_mm: {use: [], kind: removed, since: v0.6.0, note: "internal field; set transducer.focal_distance_ep"}
  expected_focal_distance_bowl_mm: {use: [], kind: removed, since: v0.6.0, note: "internal field; set transducer.focal_distance_bowl"}
  calibration.optmethod: {use: calibration.opt_method, kind: rename, since: v0.6.0}
  calibration.seed: {use: calibration.opt_seed, kind: rename, since: v0.6.0}
  calibration.addEPdistance: {use: calibration.add_FDO, kind: rename, since: v0.6.0}
  placement.plantus.additional_offset_mm: {use: placement.skin_gap_mm, kind: rename, since: v0.7-pre}
  calibration.weights: {use: calibration.opt_weights, kind: convert, convert: calibration_weights, since: v0.6.0, note: "the meaning is inverted (now 0 = uniform, w >= 1 = Gaussian with SD = centre/w); set calibration.opt_weights"}
  calibration.path_input_phase: {use: [], kind: removed, since: v0.7-pre, note: "no longer read"}
  calibration.submit_medium: {use: [], kind: removed, since: v0.6.0, note: "calibration runs use platform"}
  calibration.save_in_calibration_folder: {use: [], kind: removed, since: v0.7-pre, note: "outputs go to calibration.path_output, path_output_profiles and library_path"}
  calibration.interpolateToEP: {use: [], kind: removed, since: v0.6.0, note: "v0.5.0 overwrote it before use, so it had no effect"}
  calibration.fit_velocity_to_intensity: {use: [], kind: removed, since: v0.6.1, note: "the drive scales with sqrt(ISPPA)"}
  calibration.opt_upper_velocity: {use: [], kind: removed, since: v0.7-pre, note: "the drive scales with sqrt(ISPPA)"}
  calibration.opt_amp_validation: {use: [], kind: removed, since: v0.7-pre, note: "the drive scales with sqrt(ISPPA); kwave_drive_calibration calibrates each depth once"}
  # Converted where they are read (source):
  transducer.annular.elem_amp: {use: transducer.annular.elem_p_amp, source: validate_annular_transducer.m}
  transducer.matrix.elem_amp: {use: transducer.matrix.elem_p_amp, source: validate_matrix_transducer.m}
  calibration.target_isppa_wcm2: {use: transducer.target_isppa_wcm2, source: load_parameters.m}
  io.external_acoustic_nifti: {use: path.acoustic_input, source: load_parameters.m}

extra:
  simulation.async_grid_mode:
    kind: str
    default: shared
    choices: [shared, per_transducer]
    visible_if: {key: simulation.transducer_coupling, in: [async]}
    help: "Async coupling: 'shared' preprocesses one grid for all transducers; 'per_transducer' builds one grid each (parallel on HPC)."
  simulation.uncertainty:
    kind: bool
    default: false
    help: Run the uncertainty pipeline (medium property variants) instead of a single simulation; see doc_uncertainty.md.
  transducer.align_to_focus:
    kind: bool
    default: []
    derived: true
    help: Set by the transducer validators (annular and 1D-steered matrix → true); a configured value is overwritten.
  transducer.tx_calibration:
    kind: yaml
    default: {}
    help: "Calibration record of the drive, written by the calibration pipeline and the transducer library; isppa_wcm2 is the free-water ISPPA that elem_p_amp produces. A target_isppa_wcm2 that differs from it rescales the results."
  timing.pulse_ramp_dur:
    kind: number
    default: 0
    unit: s
    help: "Rise (= fall) duration of the amplitude ramp at the start and end of each pulse [s]; 0 = rectangular pulse. Used for the pulse-average intensity (Ipa = factor × Itp)."
  timing.pulse_ramp_shape:
    kind: str
    default: linear
    choices: [linear, tukey]
    help: "Shape of the pulse ramp: 'linear' or 'tukey' (raised cosine)."
  transducer.annular.elem_phase_rad:
    kind: numbers
    default: []
    unit: rad
    visible_if: {key: transducer.type, in: [annular]}
    help: Source phase of each element in radians; alternative to elem_phase_deg.
  acoustic_backend:
    kind: str
    default: kwave
    choices: [kwave, kwave_elastic, babelbrain, jwave]
    help: "Acoustic solver: 'kwave' (default) | 'kwave_elastic' (shear waves in skull) | 'babelbrain' | 'jwave'"
  thermal_backend:
    kind: str
    default: kwave
    choices: [kwave, babelbrain]
    help: "Thermal solver: 'kwave' (default) | 'babelbrain' (requires acoustic_backend: 'babelbrain')"
  transducer.serial:
    kind: str
    default: ''
    help: Equipment serial (config/equipment/<serial>.yaml); geometry is filled in from the library.
  transducer.library_path:
    kind: dir
    default: ''
    help: Folder with your own calibration entries (e.g. from refine_transducer_library); used when it holds one for this transducer.
  transducer.combo.ds_serial:
    kind: str
    default: ''
    help: Driving-system serial; selects the calibration entry <serial>_<ds_serial>.yaml.
  grid.z_beyond_focus_mm:
    kind: number
    default: 40
    unit: mm
    help: Extra axial length beyond the focal depth when acoustic_fov_length_mm or default_dims is 'auto'.
  grid.water_margin_mm:
    kind: number
    default: 5
    unit: mm
    help: Lateral margin on each side of the aperture when default_dims is 'auto'.
  grid.acoustic_fov_diameter_mm:
    kind: yaml
    default: []
    unit: mm
    help: Lateral diameter of the beam-axis-aligned acoustic sub-grid; 'auto' = outermost element diameter.
  grid.acoustic_fov_length_mm:
    kind: yaml
    default: []
    unit: mm
    help: Axial length of the acoustic sub-grid; 'auto' = focal depth + z_beyond_focus_mm.
  grid.thermal_use_acoustic_fov:
    kind: flag
    default: 0
    help: Run the thermal simulation within the acoustic FOV as well (faster, less accurate cooling boundary).
  grid.thermal_resolution_mm:
    kind: number
    default: []
    unit: mm
    help: Grid resolution for the thermal simulation only; empty reuses the acoustic resolution.
  grid.thermal_fov_mm:
    kind: number
    default: []
    unit: mm
    help: Independent thermal FOV around the focus, independent of the acoustic FOV.
  grid.steady_state_transits:
    kind: number
    default: 1
    help: Domain-diagonal one-way transits (at minimum sound speed) before recording starts.
  grid.steady_state_num_periods:
    kind: number
    default: 3
    help: Number of trailing wave periods recorded as the steady-state window.
  grid.pml_size_range:
    kind: numbers
    default: [10, 40]
    unit: grid points
    help: Search range [min, max] of pml_size 'auto' (k-Wave getOptimalPMLSize).
  grid.pml_alpha:
    kind: number
    default: []
    help: PML absorption in Nepers per grid point; empty uses k-Wave's default (2).
  grid.bli_tolerance:
    kind: number
    default: []
    help: kWaveArray band-limited interpolation tolerance; empty uses 0.1 (3D) or 0.01 (axisymmetric).
  grid.bli_upsampling_rate:
    kind: number
    default: []
    help: kWaveArray integration-point upsampling rate; empty uses 10 (3D) or 100 (axisymmetric).
  grid.source_ppp:
    kind: number
    default: []
    help: Time steps per wave period; when set, replaces the PPW/CFL derivation of the time step.
  grid.sim_time_us:
    kind: number
    default: []
    unit: us
    help: Fixed simulation duration; when set, replaces steady_state_transits.
  grid.origin_ras_mm:
    kind: vec3
    default: []
    unit: RAS mm
    help: RAS mm of voxel [1,1,1] for spatially registered phantom/water outputs.
  placement.tus_entry.script_path:
    kind: file
    default: ''
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Full path to TUS_entry.R.
  placement.tus_entry.env_path:
    kind: dir
    default: ''
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Conda environment containing Rscript.
  placement.tus_entry.scalp_mask:
    kind: file
    default: ''
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Optional NIfTI head/scalp mask in the T1 grid (nonzero = head); default SimNIBS final_tissues.nii.gz. Filled into a solid head mask in the cache.
  placement.tus_entry.target_mask:
    kind: file
    default: ''
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Binary NIfTI target mask; when empty a sphere is built from focus_pos or mni_target_mm.
  placement.tus_entry.mni_target_mm:
    kind: vec3
    default: []
    unit: MNI mm
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: MNI target coordinate; defaults to transducer.focus_pos.
  placement.tus_entry.return_candidates:
    kind: bool
    default: false
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Save the full ranked candidate list as RDS.
  placement.tus_entry.target_name:
    kind: str
    default: 'target'
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Target label, used in the run folder and file names.
  placement.tus_entry.target_mask_radius_mm:
    kind: number
    default: 5
    unit: mm
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Radius of the spherical target mask built when target_mask is empty.
  placement.tus_entry.exclu_mask:
    kind: file
    default: ''
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Optional binary NIfTI of regions trajectories must avoid (T1 grid).
  placement.tus_entry.minimal_distance_cm:
    kind: number
    default: 4.24
    unit: cm
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Smallest scalp-target depth. Set to the transducer's steering range.
  placement.tus_entry.maximal_distance_cm:
    kind: number
    default: 7.46
    unit: cm
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Largest scalp-target depth. Set to the transducer's steering range.
  placement.tus_entry.transducer_size_cm:
    kind: number
    default: 6.4
    unit: cm
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Transducer outer diameter (rim used for the coupling score).
  placement.tus_entry.voxel_size_cm:
    kind: number
    default: []
    unit: cm
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Voxel size TUS_entry uses for distances; empty = the mean T1 voxel size.
  placement.tus_entry.resolution_cm:
    kind: number
    default: 0.33
    unit: cm
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Spatial decimation step of the candidate search.

# ── Tabs of the main window ────────────────────────────────────────────
# Each tab shows its sections as collapsible groups. Sections marked
# 'advanced' above, and fields marked 'advanced' below, are hidden until
# "Show advanced options" is ticked on that tab (they stay visible while
# they hold a value). Sections not listed here go to the Setup tab.
tabs:
  - key: setup
    label: Setup
    intro: Subject, input and output folders, software locations and how outputs are written.
    sections: [general, path, startup, io]
  - key: transducer
    label: Transducer
    intro: The device and driving system, its geometry, drive level and focal depth.
    sections: [transducer, calibration]
  - key: placement
    label: Placement
    intro: Where the transducer sits and where it focuses, from coordinates, neuronavigation or planning tools.
    sections: [placement, neuronav]
  - key: simulation
    label: Simulation
    intro: Medium and solver, the simulation grid, the sonication protocol and the thermal model.
    sections: [simulation, grid, timing, thermal, segmentation, headmodel, pct, layers, medium_properties, jwave, babelbrain, elastic, time_reversal]
  - key: study
    label: Study
    intro: Many subjects with per-run settings, targeting accuracy and the group report.
    sections: [study, analysis]
  - key: run
    label: Run
    intro: Pipeline stages, where to run (this computer or HPC), and the run log.
    sections: [modules, hpc, snellius]
  - key: results
    label: Results
    intro: Acoustic/thermal maps, the HTML report and the output table from the last run.
    sections: []

# ── Display: labels, advanced flags, placement in the forms ───────────
# Same pattern rules as 'fields' (applied after them). 'label' replaces the
# key as the field name (the key stays in the tooltip); 'help' replaces the
# config_default.yaml comment; 'group' shows a key in another section.
display:
  # General
  subject_id: {label: Subject ID}
  platform: {label: Run on, group: hpc, group_first: true, help: "Where the pipeline runs: 'auto' submits to SLURM/qsub when a scheduler is found, 'matlab' runs in this MATLAB session (recommended for testing), 'slurm'/'qsub' force a scheduler."}
  acoustic_backend: {label: Acoustic solver, group: simulation, group_first: true}
  thermal_backend: {label: Thermal solver, group: simulation, group_first: true}

  # Simulation
  simulation.medium: {label: Medium, help: "'layered': head model from the SimNIBS segmentation (skin, skull, brain, …); 'water': free-field simulation in water; 'phantom': a user-defined phantom."}
  simulation.code_type: {label: k-Wave code}
  simulation.precision: {label: Numerical precision, advanced: true}
  simulation.interactive: {label: Interactive mode, advanced: true}
  simulation.debug: {label: Debug outputs, advanced: false}
  simulation.transducer_coupling: {label: Multi-transducer coupling}
  simulation.async_grid_mode: {label: Async grid mode, advanced: true}
  simulation.uncertainty: {label: Uncertainty analysis, advanced: true}
  simulation.uncertainty_temp_high: {label: Temp-H medium file (max. heating), help: "Medium properties of the Temp-H variant, the ITRUSST bounds that maximise brain heating: a YAML file with a medium_properties block (absolute path, or a file name in config/uncertainty/). Empty = the shipped config_medium_temp_high.yaml. Tissues and properties the file does not list keep the default medium properties."}
  simulation.uncertainty_temp_low: {label: Temp-L medium file (min. heating), help: "Medium properties of the Temp-L variant, the ITRUSST bounds that minimise brain heating: a YAML file with a medium_properties block (absolute path, or a file name in config/uncertainty/). Empty = the shipped config_medium_temp_low.yaml. Tissues and properties the file does not list keep the default medium properties."}
  simulation.uncertainty_trans_high: {label: Trans-H medium file (max. intensity), help: "Medium properties of the Trans-H variant, the ITRUSST bounds that maximise brain intensity: a YAML file with a medium_properties block (absolute path, or a file name in config/uncertainty/). Empty = the shipped config_medium_trans_high.yaml. Tissues and properties the file does not list keep the default medium properties. Acoustic only: the pipeline runs no heating for this variant, so thermal properties are not used."}
  simulation.uncertainty_trans_low: {label: Trans-L medium file (min. intensity), help: "Medium properties of the Trans-L variant, the ITRUSST bounds that minimise brain intensity: a YAML file with a medium_properties block (absolute path, or a file name in config/uncertainty/). Empty = the shipped config_medium_trans_low.yaml. Tissues and properties the file does not list keep the default medium properties. Acoustic only: the pipeline runs no heating for this variant, so thermal properties are not used."}

  # Paths
  path.anat: {label: Anatomical images folder}
  path.sim: {label: Simulation outputs folder}
  path.seg: {label: SimNIBS segmentations folder}
  path.t1_pattern: {label: T1 file pattern}
  path.t2_pattern: {label: T2 file pattern}
  path.localite_raw: {label: Localite exports (raw), group: placement}
  path.localite_post: {label: Ingested Localite markers, group: placement}
  path.localite_t1: {label: Localite planning T1 folder, group: placement, advanced: true}
  path.localite_t1_pattern: {label: Localite planning T1 pattern, group: placement, advanced: true}
  path.localite_export: {label: Localite export folder, group: placement, advanced: true}
  path.localite: {label: Localite folder (deprecated), group: placement, advanced: true}
  path.pct: {label: Pseudo-CT output folder, advanced: true}
  path.acoustic_input: {label: Start from pressure map (NIfTI), advanced: true}
  path.placement: {label: Placement output folder, group: placement, advanced: true}

  # Environment
  startup.simnibs_bin_path: {label: SimNIBS bin folder}
  startup.matlab_bin_path: {label: MATLAB binary (HPC pCT), advanced: true}
  startup.fsl_bin_path: {label: FSL bin folder, advanced: true}
  startup.ants_bin_path: {label: ANTs bin folder, advanced: true}
  startup.ants_simg_path: {label: ANTs Singularity image, advanced: true}
  startup.modules_to_load: {label: HPC modules to load, advanced: true}
  startup.paths_to_add: {label: Extra MATLAB paths, advanced: true}
  startup.subpaths_to_add: {label: Extra MATLAB paths (recursive), advanced: true}

  # I/O
  io.output_affix: {label: Output name affix}
  io.overwrite_files: {label: Overwrite existing outputs, help: "What to do when outputs already exist: 'never' reuses them; 'always' recomputes the outputs (chained pipelines reuse intermediate caches); 'force' also recomputes intermediate stages; any other value asks. See doc_outputs.md#overwrite-behaviour."}
  io.cache_signature_check: {label: Check reused caches, help: "When a grid or medium cache is reused (overwrite 'never', or intermediate stages of chained pipelines) but was built with different settings: 'error' stops, 'warn' reuses it anyway, 'off' skips the check. See doc_outputs.md#cache-reuse-checks."}
  io.overwrite_simnibs: {label: Re-run SimNIBS segmentation, advanced: true}
  io.save_*: {advanced: true}
  io.save_MNI: {label: Also save MNI-space NIfTIs, advanced: false}
  io.save_matrices: {label: Save intermediate matrices (fallback)}
  io.save_source_matrices: {label: Save source matrices}
  io.save_acoustic_matrices: {label: Save acoustic matrices (large)}
  io.save_thermal_matrices: {label: Save thermal matrices}
  io.save_heatingvideo: {label: Save heating video}
  io.save_property_maps: {label: Save medium property maps}
  io.save_Ipa: {label: Save pulse-average intensity map}
  io.save_Ita: {label: Save time-average intensity map}
  io.save_p_complex: {label: Save complex pressure field}

  calibration: {label: Calibration conventions}
  calibration.focal_reference: {label: Focal-depth reference, advanced: true}

  # Pipeline stages
  modules.*: {advanced: true}
  modules.run_transducer_placement: {label: Resolve placement}
  modules.run_grid_setup: {label: Grid and head model}
  modules.run_medium_setup: {label: Medium properties}
  modules.run_source_setup: {label: Acoustic source}
  modules.run_water_baseline: {label: Free-water baseline run, help: "Free-water simulation that measures the ISPPA of the current drive, so results can be scaled to transducer.target_isppa_wcm2. 'auto' runs it when a target needs it (no library calibration, or a target different from it); 1 always; 0 only when the target differs from a calibration. A target that cannot be met stops the run. See doc_simulations-acoustic.md#isppa-targeting."}
  modules.run_acoustic_sims: {label: Acoustic simulation, advanced: false}
  modules.run_acoustic_analysis: {label: Acoustic analysis}
  modules.run_heating_sims: {label: Thermal simulation, advanced: false}
  modules.run_thermal_analysis: {label: Thermal analysis}
  modules.run_nifti_creation: {label: NIfTI export}
  modules.run_posthoc_water_sims: {label: Free-water comparison after the head simulation, advanced: false}
  modules.run_targeting_analysis: {label: Targeting accuracy, advanced: false}
  modules.generate_report: {label: HTML report, advanced: false}
  modules.report_style: {label: Report style}
  modules.report_style_switcher: {label: Embed report style switcher}
  modules.generate_group_report: {label: Update group report after each subject, advanced: false}
  modules.segmentation_only: {label: Stop after segmentation}

  # Study
  study.manifest: {label: Manifest file, group: __manifest_editor__}   # edited in the manifest card
  study.name: {label: Study name}

  # HPC
  hpc.name: {label: Cluster profile, advanced: true}
  hpc.gpu: {label: GPU request, help: "Scheduler GPU request, e.g. 'nvidia_a100-sxm4-40gb:1' (SLURM --gres); empty = any GPU when the code type needs one."}
  hpc.partition: {label: Partition, help: "SLURM partition; empty = 'gpu' for GPU code, the cluster default otherwise. Ignored by qsub."}
  hpc.reservation: {label: Reservation, advanced: true, help: Scheduler reservation name (optional).}
  hpc.wait_for_job: {label: Wait for the job to finish, advanced: true, help: Block MATLAB until the submitted job has finished (otherwise MATLAB returns after submission).}
  hpc.timelimit: {label: Time limit, help: "Wall-time limit per job (HH:MM:SS)."}
  hpc.memorylimit: {label: Memory limit, help: Memory per job.}
  hpc.ld_library_path: {label: LD_LIBRARY_PATH for SimNIBS, advanced: true}
  hpc.job_prefix: {label: Job name prefix, advanced: true}
  hpc.max_wait_checks: {label: Max. status checks while waiting, advanced: true}

  # Analysis
  analysis: {label: Targeting & analysis}
  analysis.focus_area_radius: {label: Target area radius, advanced: true}
  analysis.target_mni_mm: {label: Intended target (MNI)}
  analysis.target_roi_mni: {label: Target ROI mask (MNI)}

  # Transducer
  transducer.name: {label: Name}
  transducer.type: {label: Array type}
  transducer.freq_hz: {label: Frequency}
  transducer.target_isppa_wcm2: {label: Target free-water Isppa}
  transducer.trans_pos: {label: Transducer position (bowl apex)}
  transducer.focus_pos:
    label: Target position
    help: "The planned target (focus_pos). With trans_pos it sets the beam axis; its distance from the exit plane is the planned target depth, which the placement viewer shows next to the focal depth setting."
  transducer.focal_distance_ep:
    label: Focal depth setting (exit plane)
    help: "The depth the device is set to focus at, from the exit plane: the value set on the equipment. For annular arrays it selects the calibrated phases and drive, so the simulated focus lands here even when the target (focus_pos) is deeper or shallower. Use Set to target depth in the placement viewer to make them equal."
  transducer.focal_distance_bowl: {label: Focal depth setting (bowl apex), advanced: true}
  transducer.focal_distance_offset: {label: Bowl-to-exit-plane offset, advanced: true}
  transducer.serial: {label: Equipment serial}
  transducer.library_path: {label: Own calibration library}
  transducer.combo.ds_serial: {label: Driving-system serial}
  transducer.align_to_focus: {label: Align to focus, advanced: true}
  transducer.annular: {label: Annular geometry and drive}
