# ── Tuning: keys worth revisiting when optimising a run ────────────────
# Most users never touch these. 'tuning' tags a key (same pattern rules as
# 'fields') with the goals it trades off; the Nexus then offers them through
# "Tune for" on each tab, which shows the tagged keys (advanced ones too) and
# marks them. Tags describe what a key affects, not which way to move it; the
# help text says that. Only use goals listed in 'tune_goals' (test_schema
# checks this and that every pattern still matches a key).
tune_goals:
  speed:    {label: Speed, help: Run time of the simulation stages.}
  accuracy: {label: Accuracy, help: Numerical accuracy and convergence of the simulated fields.}
  memory:   {label: Memory, help: RAM / GPU memory needed while the simulation runs.}
  disk:     {label: Disk space, help: Size of the outputs written per subject.}

