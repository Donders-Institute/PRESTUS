  placement.plantus.min_distance_mm: {label: "Min. distance"}
  placement.plantus.max_distance_mm: {label: "Max. distance"}
  placement.plantus.optimal_distance_mm: {label: "Optimal distance"}

# ── Choice labels ──────────────────────────────────────────────────────
# Drop-down text for choice values; the config keeps the value. Exact key
# paths only. A labelled key labels every choice (test_choice_icons checks
# keys, choices and completeness). Labels are short noun phrases; the
# explanation stays in the help text, shown with the YAML value when hovering
# an item. A key without an entry shows its raw values. Quote choices YAML
# would read as booleans ('off'); 0/1 stay integers.
choice_labels:
  platform: {auto: Auto-detect, slurm: SLURM, qsub: qsub, matlab: This MATLAB session}
  hpc.name: {default: Default, snellius: Snellius}
  acoustic_backend: {kwave: k-Wave, kwave_elastic: k-Wave elastic (experimental), babelbrain: BabelBrain (experimental), jwave: j-Wave (experimental)}
  thermal_backend: {kwave: k-Wave, babelbrain: BabelBrain (experimental)}
  simulation.medium: {water: Free water, layered: Head model, phantom: Phantom}
  simulation.code_type: {matlab_cpu: 'MATLAB, CPU', matlab_gpu: 'MATLAB, GPU', cpp_cpu: 'C++ binary, CPU', cpp_gpu: 'C++ binary, GPU (CUDA)', cpp_mlx: 'C++ binary, Apple Silicon GPU'}
  simulation.precision: {single: Single, double: Double}
  simulation.transducer_coupling: {coherent: Coherent, async: Asynchronous}
  timing.async_schedule: {pulses: "Pulses take turns", trains: "Pulse trains take turns", custom: "Custom offsets and timing"}
  grid.async_layout: {shared: Shared grid, per_transducer: One grid per transducer}
  io.overwrite_files: {never: Reuse existing outputs, always: Recompute outputs, force: Recompute outputs and intermediate stages, ask: Ask}
  io.cache_signature_check: {error: Stop on mismatch, warn: Warn and reuse, 'off': Do not check}
  modules.run_water_baseline: {auto: Auto, 1: Always, 0: Only when the target differs from the calibration}
  report.style: {instrument: Instrument, classic: Classic, compact: Compact, paper: Paper}
  calibration.focal_reference: {peak: Intensity peak, flhm_3db: 'FLHM centre, −3 dB', flhm_6db: 'FLHM centre, −6 dB'}
  transducer.type: {annular: Annular array, matrix: Matrix array}
  transducer.matrix.steering: {'1D': Axial (1D), '3D': Volumetric (3D)}
  transducer.matrix.elem_shape: {rect: Rectangle, disc: Disc, bowl: Bowl}
  transducer.matrix.matrix_shape.type: {define_here: Define here, extract_from_file: Load from file}
  transducer.matrix.matrix_shape.define_here.grid_shape.type: {rect: Rectangular grid, fibonacci: Fibonacci spiral, fermat: Fermat spiral}
  timing.pulse_ramp_shape: {linear: Linear, tukey: Tukey (raised cosine)}
  placement.mode: {manual: Manual coordinates, localite: Localite neuronavigation, heuristic: Heuristic search, mni: MNI coordinates, plantus: PlanTUS, tus_entry: TUS_entry}
  placement.reuse: {auto: Auto, always: Always, never: Never}
  placement.manual.coordinate_space: {voxel: Voxel indices, ras: Subject RAS (mm), mni: MNI (mm)}
  placement.plantus.interactive: {0: Take the optimum, 1: Choose in Workbench}
  grid.mode: {focal_axis: Focal axis, transducer_axis: Transducer axis, ras_plus: RAS+ (no rotation)}
  grid.axisymmetric_output: {auto: Auto, '2d': 2D plane, '3d': 3D volume}
  grid.water_baseline_grid: {beam: Beam box, full: Full grid}
  headmodel.smooth_method: {gaussian: Gaussian, box: Box, 'off': 'Off'}
  headmodel.skull_fill_method: {rubberwrap: Rubber wrap, imclose: Morphological closing}
  pct.skull_mapping: {miscouridou: Miscouridou, carpino: Carpino (deprecated), wiesinger: Wiesinger, treeby: Treeby, kosciessa: Kosciessa, custom: Custom}
  pct.mapping_density: {k-plan: k-Plan, k-wave: k-Wave, marsac: Marsac, marsac-babelbrain: Marsac (BabelBrain), aubry: Aubry, air-tissue: Air/tissue, none: None}
  pct.mapping_soundspeed: {k-plan: k-Plan, marsac: Marsac, aubry: Aubry, webb: Webb, pichardo: Pichardo, mcdannold: McDannold, none: None}
  pct.mapping_attenuation: {k-plan: k-Plan, mueller: Mueller, aubry: Aubry, webb: Webb, pichardo: Pichardo, mcdannold: McDannold, none: None}
  thermal.cem43_iso: {0: k-Wave (kWaveDiffusion), 1: ISO 14708-3 / ITRUSST}
  time_reversal.placement_search.jitter_mode: {grid: Along grid axes, scalp: Over the scalp}
  time_reversal.pose_workflow.aim: {corrected: Aberration-corrected, geometric: Geometric target, both: Both}
  time_reversal.pose_workflow.verify_fov: {partial: Acoustic FOV, full: Full grid, config: As configured}
  time_reversal.pose_workflow.rank_by: {target_intensity: Target intensity, focus_error: Focus error}
  jwave.solver: {helmholtz: Helmholtz (frequency domain), pseudo_spectral: Pseudo-spectral (time domain), finite_differences: Finite differences (time domain)}
  elastic.shear_mapping: {pichardo: Pichardo et al. 2017, 'off': Off (fluid skull)}
  elastic.long_attenuation: {elastic: Elastic model, medium: Fluid medium}
  babelbrain.computing_backend: {auto: Auto, cuda: CUDA, opencl: OpenCL, metal: Metal, cpu: CPU}
  babelbrain.shear: {'off': Off (fluid bone), prestus_elastic: k-Wave elastic skull properties}
  babelbrain.focal_calibration_target: {flhm_center: 'FLHM centre, −3 dB', peak: Intensity peak}

# ── Choice icons and figures ───────────────────────────────────────────
# Schematics for drop-down choices, drawn in ui/choice_icons.py. Exact key
# paths only. 'choice_icons' puts a glyph before a choice in the drop-down;
# 'choice_figures' shows figures (with captions) under the selected choice.
# A choice without an entry stays text only. Quote choices YAML would read as
# booleans ('off'). test_schema checks keys, choices and names.
choice_icons:
  simulation.transducer_coupling: {coherent: coupling_coherent, async: coupling_async}
  grid.async_layout: {shared: asyncgrid_shared, per_transducer: asyncgrid_per_transducer}
  simulation.medium: {water: medium_water, layered: medium_layered, phantom: medium_phantom}
  transducer.type: {annular: tx_annular, matrix: tx_matrix}
  transducer.matrix.steering: {'1D': steer_1d, '3D': steer_3d}
  transducer.matrix.elem_shape: {rect: elem_rect, disc: elem_disc, bowl: elem_bowl}
  transducer.matrix.matrix_shape.define_here.grid_shape.type: {rect: layout_rect, fibonacci: layout_fibonacci, fermat: layout_fermat}
  placement.mode: {manual: place_manual, localite: place_localite, heuristic: place_heuristic, mni: place_mni, plantus: place_plantus, tus_entry: place_tus_entry}
  grid.mode: {focal_axis: gridmode_focal_axis, transducer_axis: gridmode_transducer_axis, ras_plus: gridmode_ras_plus}
  grid.axisymmetric_output: {'2d': axisym_2d, '3d': axisym_3d}
  grid.water_baseline_grid: {beam: baseline_beam, full: baseline_full}
  calibration.focal_reference: {peak: focalref_peak, flhm_3db: focalref_flhm_3db, flhm_6db: focalref_flhm_6db}
  headmodel.smooth_method: {gaussian: smooth_gaussian, box: smooth_box, 'off': smooth_off}
  headmodel.skull_fill_method: {rubberwrap: fill_rubberwrap, imclose: fill_imclose}
  timing.pulse_ramp_shape: {linear: ramp_linear, tukey: ramp_tukey}
  time_reversal.pose_workflow.aim: {geometric: aim_geometric, corrected: aim_corrected, both: aim_both}
  time_reversal.pose_workflow.rank_by: {target_intensity: rank_target_intensity, focus_error: rank_focus_error}
  time_reversal.placement_search.jitter_mode: {grid: jitter_grid, scalp: jitter_scalp}

choice_figures:
  simulation.transducer_coupling:
    coherent: [coupling_wavefronts_coherent, coupling_traces_coherent]
    async: [coupling_wavefronts_async, coupling_traces_async]
  grid.mode:
    focal_axis: [gridmode_focal_axis_fig]
    transducer_axis: [gridmode_transducer_axis_fig]
    ras_plus: [gridmode_ras_plus_fig]
  grid.async_layout:
    shared: [asyncgrid_shared_fig]
    per_transducer: [asyncgrid_per_transducer_fig]

# ── Tuning: keys worth revisiting when optimising a run ────────────────
# Most users never touch these. 'tuning' tags a key (same pattern rules as
# 'fields') with the goals it trades off; the Nexus then offers them through
# "Tune for" on each tab, which shows the tagged keys (advanced ones too) and
# marks them. Tags describe what a key affects, not which way to move it; the
# help text says that. Only use goals listed in 'tune_goals' (test_schema
# checks this and that every pattern still matches a key).
tune_goals:
  speed:    {label: Speed, help: Run time of the simulation stages.}
  accuracy: {label: Accuracy, help: Numerical accuracy and convergence of the simulated fields.}
  memory:   {label: Memory, help: RAM / GPU memory needed while the simulation runs.}
  disk:     {label: Disk space, help: Size of the outputs written per subject.}

tuning:
  simulation.code_type: [speed]
  simulation.precision: [accuracy, memory]
  grid.resolution_mm: [speed, accuracy, memory]
  grid.pml_size: [speed]
  grid.max_expand: [speed]
  grid.source_ppw: [speed, accuracy]
  grid.source_cfl: [speed, accuracy]
  grid.source_limit_fraction: [speed, accuracy]
  grid.source_ppp: [speed, accuracy]
  grid.sim_time_us: [speed, accuracy]
  grid.steady_state_transits: [speed, accuracy]
  grid.steady_state_num_periods: [speed, accuracy]
  grid.use_kWaveArray: [accuracy]
  grid.axisymmetric: [speed, memory]
  grid.z_beyond_focus_mm: [speed, memory]
  grid.acoustic_fov_diameter_mm: [speed, memory]
  grid.acoustic_fov_length_mm: [speed, memory]
  grid.thermal_use_acoustic_fov: [speed, accuracy]
  grid.thermal_resolution_mm: [speed, memory]
  grid.thermal_fov_mm: [speed, memory]
  timing.pt_timestep: [speed, accuracy]
  timing.post_pt_timestep: [speed, accuracy]
  jwave.use_gpu: [speed]
  jwave.gmres_maxiter: [speed, accuracy]
  babelbrain.ppw: [speed, accuracy]
  babelbrain.use_rayleigh_for_water: [speed]
  babelbrain.cleanup_cache: [disk]
  io.save_matrices: [disk]
  io.save_acoustic_matrices: [disk]
  io.save_thermal_matrices: [disk]
  io.save_p_complex: [disk]
  io.save_heatingvideo: [disk]
