# Schema overlay for the PRESTUS Nexus.
#
# config/config_default.yaml stays the single source of truth for keys,
# defaults and help text; the Nexus derives its schema from it. This file
# only adds what the YAML cannot express:
#
#   fields:   per-key attributes, matched by dotted path. '*' globs one or more
#             path segments (fnmatch); matches apply in file order, so put
#             broad patterns first and exact keys after.
#   extra:    keys PRESTUS code reads that are absent (or commented out) in
#             config_default.yaml. The drift test checks each is referenced
#             in functions/.
#   deprecated: old keys with their replacement ('use'). Entries with a 'kind'
#             (configs from v0.5.0 on) are applied by upgrade_config_keys.m when
#             a config is loaded: rename (moved), convert (exact value
#             conversion, 'convert' names the converter), removed (dropped;
#             with 'keep', any other value is an error), error (no exact
#             conversion: the run stops). 'since' is the first release
#             without the key. Entries without a kind are converted by their
#             'source'; 'ignored: true' when PRESTUS no longer reads them.
#   sections: display labels and advanced flags for top-level groups.
#             locked: true shows the section read-only until its card is unlocked
#             (validated constants most studies must not change).
#   tune_goals / tuning: what a key can be tuned for (speed, accuracy, …);
#             see the end of this file.
#
# Keys found in config/config_calibration.yaml are recognised as belonging to
# the calibration workflow and are not reported as unknown.
#
# Field attributes:
#   kind:        str | int | float | number | numbers | vec3 | flag | bool |
#                tristate | dir | file | path | strlist | yaml
#                (flag = 0/1 integer shown as a checkbox; numbers = scalar or
#                row vector; yaml = free YAML text, e.g. int-or-'auto')
#   choices:     allowed values (rendered as a drop-down)
#   unit:        display unit
#   visible_if:  {key: <dotted path>, in: [values]}  (or not_in)
#   derived:     computed by PRESTUS; shown read-only, never written
#   help:        replaces the help text taken from config_default.yaml

sections:
  general:            {label: General}
  simulation:         {label: Simulation}
  path:               {label: Paths}
  startup:            {label: Environment}
  io:                 {label: Input / output}
  calibration:        {label: Calibration, advanced: true}
  modules:            {label: Pipeline stages}
  study:              {label: Study (group)}
  hpc:                {label: HPC}
  snellius:           {label: Snellius partitions, advanced: true}
  analysis:           {label: Analysis}
  transducer:         {label: Transducer}
  placement:          {label: Placement}
  grid:               {label: Grid}
  segmentation:       {label: Segmentation, advanced: true}
  headmodel:          {label: Head model, advanced: true}
  pct:                {label: Pseudo-CT}
  layers:             {label: Tissue layers, advanced: true}
  timing:             {label: Sonication timing}
  thermal:            {label: Thermal}
  jwave:              {label: jwave backend}
  babelbrain:         {label: BabelBrain backend}
  elastic:            {label: Elastic skull model}
  time_reversal:      {label: Time reversal, advanced: true}
  medium_properties:  {label: Medium properties, advanced: true, locked: true}

fields:
  # ── General ──────────────────────────────────────────────────────────
  subject_id: {kind: int, min: 0, max: 999}
  platform: {choices: [auto, slurm, qsub, matlab]}

  # ── Simulation ───────────────────────────────────────────────────────
  simulation.medium: {choices: [water, layered, phantom]}
  simulation.code_type:          # k-Wave runs: acoustic, thermal (with heating) or time reversal
    choices: [matlab_cpu, matlab_gpu, cpp_cpu, cpp_gpu, cpp_mlx]
  simulation.precision: {choices: [single, double]}
  simulation.interactive: {kind: flag}
  simulation.debug: {kind: flag}
  simulation.transducer_coupling: {choices: [coherent, async]}
  simulation.uncertainty_temp_high: {kind: file, visible_if: {key: simulation.uncertainty, in: [true]}}
  simulation.uncertainty_temp_low: {kind: file, visible_if: {key: simulation.uncertainty, in: [true]}}
  simulation.uncertainty_trans_high: {kind: file, visible_if: {key: simulation.uncertainty, in: [true]}}
  simulation.uncertainty_trans_low: {kind: file, visible_if: {key: simulation.uncertainty, in: [true]}}

  # ── Paths & environment ──────────────────────────────────────────────
  path.anat: {kind: dir}
  path.sim: {kind: dir}
  path.seg: {kind: dir}
  path.placement: {kind: dir}
  path.localite*: {kind: dir}
  path.localite_t1_pattern: {kind: str}
  path.pct: {kind: dir}
  path.acoustic_input: {kind: file}
  startup.*_path: {kind: path}
  startup.modules_to_load: {kind: strlist}
  startup.paths_to_add: {kind: strlist}
  startup.subpaths_to_add: {kind: strlist}

  # ── I/O ──────────────────────────────────────────────────────────────
  io.overwrite_files: {choices: [never, always, force, ask]}
  io.cache_signature_check: {choices: [error, warn, 'off']}
  modules.run_water_baseline: {choices: [auto, 1, 0]}
  io.overwrite_simnibs: {kind: flag}
  io.save_*: {kind: flag}

  calibration.focal_reference: {choices: [peak, flhm_3db, flhm_6db]}

  # ── Modules ──────────────────────────────────────────────────────────
  modules.*: {kind: flag}
  modules.report_style: {kind: str, choices: [instrument, classic, compact, paper]}

  # ── HPC ──────────────────────────────────────────────────────────────
  hpc.name: {choices: [default, snellius]}
  hpc.memorylimit: {unit: GB}
  hpc.ld_library_path: {kind: path}
  # Scheduler settings mean nothing when the pipeline runs in this MATLAB session
  hpc.*: {visible_if: {key: platform, not_in: [matlab]}}
  snellius: {visible_if: {key: hpc.name, in: [snellius]}}

  analysis.focus_area_radius: {unit: mm}
  analysis.target_mni_mm: {kind: vec3, unit: MNI mm}
  analysis.target_roi_mni: {kind: file}

  # ── Study (group) ────────────────────────────────────────────────────
  study.manifest: {kind: file}
  study.name: {kind: str}

  # ── Transducer ───────────────────────────────────────────────────────
  transducer.name: {kind: str}
  transducer.type: {kind: str, choices: [annular, matrix]}
  transducer.freq_hz: {kind: number, unit: Hz}
  transducer.target_isppa_wcm2: {kind: numbers, unit: W/cm²}
  transducer.trans_pos: {kind: vec3}
  transducer.focus_pos: {kind: vec3}
  transducer.focal_distance_ep: {kind: number, unit: mm}
  transducer.focal_distance_bowl: {kind: number, unit: mm}
  transducer.focal_distance_offset: {kind: number, unit: mm, derived: true}

  transducer.annular: {visible_if: {key: transducer.type, in: [annular]}}
  transducer.annular.*: {kind: numbers}
  transducer.annular.elem_n: {kind: int}
  transducer.annular.elem_id_mm: {unit: mm}
  transducer.annular.elem_od_mm: {unit: mm}
  transducer.annular.elem_p_amp: {unit: Pa}
  transducer.annular.elem_phase_deg: {unit: deg}
  transducer.annular.curv_radius_mm: {kind: number, unit: mm}
  transducer.annular.dist_geom_ep_mm: {kind: number, unit: mm}
  transducer.annular.depth_mm: {kind: number, unit: mm}

  transducer.matrix: {visible_if: {key: transducer.type, in: [matrix]}}
  transducer.matrix.*: {kind: number}
  transducer.matrix.elem_p_amp: {unit: Pa}
  transducer.matrix.steering: {kind: str, choices: [1D, 3D]}
  transducer.matrix.elem_shape: {kind: str, choices: [rect, disc, bowl]}
  transducer.matrix.*_mm: {unit: mm}
  transducer.matrix.is_curved: {kind: bool}
  transducer.matrix.is_clover_setup: {kind: bool}
  transducer.matrix.clover: {visible_if: {key: transducer.matrix.is_clover_setup, in: [true]}}
  transducer.matrix.clover.n_leaves: {kind: int}
  transducer.matrix.clover.ROC_parent: {unit: mm}
  transducer.matrix.clover.az_sep_deg: {unit: deg}
  transducer.matrix.clover.elevation_deg: {unit: deg}
  transducer.matrix.elem_phase_override_deg: {kind: numbers, unit: deg}
  transducer.matrix.use_steering_correction: {kind: bool}
  transducer.matrix.steering_correction: {kind: yaml}
  transducer.matrix.matrix_shape.type: {kind: str, choices: [define_here, extract_from_file]}
  transducer.matrix.matrix_shape.define_here: {visible_if: {key: transducer.matrix.matrix_shape.type, in: [define_here]}}
  transducer.matrix.matrix_shape.define_here.grid_shape.type: {kind: str, choices: [rect, fibonacci, fermat]}
  transducer.matrix.matrix_shape.define_here.grid_shape.rect: {visible_if: {key: transducer.matrix.matrix_shape.define_here.grid_shape.type, in: [rect]}}
  transducer.matrix.matrix_shape.define_here.grid_shape.fibonacci: {visible_if: {key: transducer.matrix.matrix_shape.define_here.grid_shape.type, in: [fibonacci]}}
  transducer.matrix.matrix_shape.define_here.grid_shape.fermat: {visible_if: {key: transducer.matrix.matrix_shape.define_here.grid_shape.type, in: [fermat]}}
  transducer.matrix.matrix_shape.define_here.grid_shape.*.elem_n*: {kind: int}
  transducer.matrix.matrix_shape.extract_from_file: {visible_if: {key: transducer.matrix.matrix_shape.type, in: [extract_from_file]}}
  transducer.matrix.matrix_shape.extract_from_file.file_path: {kind: file}
  transducer.matrix.matrix_shape.extract_from_file.start_row: {kind: int}
  transducer.matrix.matrix_shape.extract_from_file.start_col: {kind: int}
  transducer.matrix.matrix_shape.extract_from_file.rot_col: {kind: int}
  transducer.matrix.matrix_shape.extract_from_file.elem_n: {kind: int}
  transducer.matrix.matrix_shape.extract_from_file.select_random_subset: {kind: bool}
  transducer.matrix.matrix_shape.extract_from_file.subset.random_seed: {kind: bool}
  transducer.matrix.matrix_shape.extract_from_file.subset.subset_n_elements: {kind: int}
  transducer.matrix.matrix_shape.extract_from_file.project_on_new_ROC: {kind: bool}

  # ── Placement ────────────────────────────────────────────────────────
  placement.mode: {choices: [manual, localite, heuristic, mni, plantus, tus_entry]}
  placement.reuse: {choices: [auto, always, never]}
  placement.skin_gap_mm: {unit: mm}
  placement.manual: {visible_if: {key: placement.mode, in: [manual]}}
  placement.manual.coordinate_space: {choices: [voxel, ras, mni]}
  placement.localite: {visible_if: {key: placement.mode, in: [localite]}}
  placement.localite.enabled: {kind: flag}
  placement.localite.file: {kind: file}
  placement.localite.session: {kind: yaml}
  placement.localite.target: {kind: yaml, help: "Pick the series by target name (the ingested name, or the XML description in file mode); '' = use the series index. With several transducers, one name per transducer, e.g. [L_M1, R_M1]: transducer i uses entry i."}
  placement.localite.position: {kind: yaml, help: "Otherwise: index of the detected series (1-based, after the pulse-count filter); with several transducers one index per transducer, e.g. [1, 2]."}
  placement.localite.markertype: {choices: [TriggerMarkers, GUMMarkers]}
  placement.localite.reference_distance_mm: {unit: mm}
  placement.localite.tracker_to_bowl_mm: {kind: number, unit: mm}
  placement.heuristic: {visible_if: {key: placement.mode, in: [heuristic]}}
  placement.heuristic.*: {kind: number}
  placement.heuristic.mni_target_mm: {kind: vec3, unit: MNI mm}
  placement.heuristic.target_name: {kind: str}
  placement.heuristic.save_localite_t1: {kind: bool}
  placement.heuristic.left_ear_center: {kind: vec3, unit: voxels}
  placement.heuristic.right_ear_center: {kind: vec3, unit: voxels}
  placement.heuristic.ear_radius: {unit: mm}
  placement.heuristic.dist_close: {unit: mm}
  placement.mni: {visible_if: {key: placement.mode, in: [mni]}}
  placement.mni.trans_pos_mm: {kind: vec3, unit: MNI mm}
  placement.mni.focus_pos_mm: {kind: vec3, unit: MNI mm}
  placement.plantus: {visible_if: {key: placement.mode, in: [plantus]}}
  placement.plantus.*_mm: {unit: mm}
  placement.plantus.script_path: {kind: dir}
  placement.plantus.env_path: {kind: dir}
  placement.plantus.connectome_wb_path: {kind: dir}
  placement.plantus.mni_target_mm: {kind: vec3, unit: MNI mm}
  placement.plantus.focal_distance_list: {kind: numbers, unit: mm}
  placement.plantus.flhm_list: {kind: numbers, unit: mm}
  placement.plantus.max_angle_deg: {unit: deg}
  placement.plantus.interactive: {choices: [0, 1]}

  # ── Grid ─────────────────────────────────────────────────────────────
  grid.resolution_mm: {unit: mm}
  grid.default_dims: {kind: yaml, unit: grid points}
  grid.pml_size: {kind: yaml}
  grid.source_ppw: {kind: number}
  grid.use_kWaveArray: {kind: flag}
  grid.axisymmetric: {kind: flag}
  grid.axisymmetric_output: {choices: [auto, 2d, 3d]}
  grid.mode: {choices: [focal_axis, transducer_axis, ras_plus]}

  segmentation.use_qform: {kind: flag}
  segmentation.debug: {kind: flag}

  headmodel.head_pad_mm: {unit: mm}
  headmodel.csf_expansion: {unit: mm}
  headmodel.smooth_method: {choices: [gaussian, box]}
  headmodel.smooth_fwhm_mm: {unit: mm}
  headmodel.skull_fill_method: {choices: [rubberwrap, imclose]}
  headmodel.skull_wrap_radius: {unit: voxels}
  headmodel.skull_wrap_visualize: {kind: flag}

  pct.enabled: {kind: flag}
  pct.debug: {kind: flag}
  pct.skull_mapping: {choices: [miscouridou, carpino, wiesinger, treeby, kosciessa]}
  pct.mapping_density: {choices: [k-plan, k-wave, marsac, aubry, air-tissue, none]}
  pct.mapping_soundspeed: {choices: [k-plan, marsac, aubry, webb, pichardo, mcdannold, none]}
  pct.mapping_attenuation: {choices: [k-plan, mueller, aubry, webb, pichardo, mcdannold, none]}

  layers.*: {kind: numbers}

  # ── Timing & thermal ─────────────────────────────────────────────────
  timing.*: {unit: s}
  timing.equal_step_duration: {kind: flag, unit: ''}
  thermal.cem43_iso: {kind: flag}
  thermal.temp_0.*: {unit: °C}
  thermal.sensor_xy_halfsize: {unit: grid points}
  thermal.record_t_at_every_step: {kind: flag}
  thermal.log_thermal_updates: {kind: flag}

  # ── Backends ─────────────────────────────────────────────────────────
  jwave: {visible_if: {key: acoustic_backend, in: [jwave]}}
  time_reversal.placement_search.jitter_mm: {kind: yaml, unit: mm}
  time_reversal.placement_search.jitter_mode: {kind: str, choices: [grid, scalp]}
  grid.water_baseline_grid: {kind: str, choices: [beam, full]}
  time_reversal.pose_workflow.poses: {kind: yaml, help: "Pose ids of the pose table to verify as well, e.g. [12, 40]."}
  time_reversal.pose_workflow.aim: {kind: str, choices: [corrected, geometric, both]}
  time_reversal.pose_workflow.verify_fov: {kind: str, choices: [partial, full, config]}
  time_reversal.pose_workflow.rank_by: {kind: str, choices: [target_intensity, focus_error]}
  time_reversal.pose_workflow.max_focus_error_mm: {kind: yaml, unit: mm}
  time_reversal.pose_workflow.search_memorylimit: {kind: yaml, unit: GB}
  jwave.python_env: {kind: path}
  jwave.python_env_gpu: {kind: path}
  jwave.use_gpu: {kind: tristate}
  jwave.precision: {choices: [single, double]}
  jwave.solver: {choices: [helmholtz, pseudo_spectral, finite_differences]}
  babelbrain: {visible_if: {key: acoustic_backend, in: [babelbrain]}}
  elastic: {visible_if: {key: acoustic_backend, in: [kwave_elastic]}}
  elastic.shear_mapping: {choices: [pichardo, 'off']}
  elastic.shear_density_min: {unit: kg/m³}
  elastic.alpha_coeff_shear: {unit: dB/(cm·MHz^y)}
  elastic.alpha_coeff_long: {unit: dB/(cm·MHz^y)}
  elastic.long_attenuation: {choices: [elastic, medium]}
  babelbrain.computing_backend: {choices: [auto, cuda, opencl, metal, cpu]}
  babelbrain.focal_calibration_target: {choices: [flhm_center, peak]}
  babelbrain.z_beyond_focus_mm: {unit: mm}
  babelbrain.python_env: {kind: path}
  babelbrain.air_regions: {kind: bool, visible_if: {key: babelbrain.ct_mapping, not_in: ['']}}
  babelbrain.air_hu_window: {kind: numbers, unit: HU}
  babelbrain.air_keep_boundary: {kind: bool}

  medium_properties.*.sound_speed: {unit: m/s}
  medium_properties.*.density: {unit: kg/m³}
  medium_properties.*.thermal_conductivity: {unit: W/m/°C}
  medium_properties.*.specific_heat_capacity: {unit: J/kg/°C}
  medium_properties.*.absorption_coeff: {kind: number, unit: dB/(cm·MHz^y), help: "Alternative to absorption_fraction: set one of the two per tissue"}

