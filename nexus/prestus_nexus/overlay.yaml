# Schema overlay for the PRESTUS Nexus.
#
# config/config_default.yaml stays the single source of truth for keys,
# defaults and help text; the Nexus derives its schema from it. This file
# only adds what the YAML cannot express:
#
#   fields:   per-key attributes, matched by dotted path. '*' globs one or more
#             path segments (fnmatch); matches apply in file order, so put
#             broad patterns first and exact keys after.
#   extra:    keys PRESTUS code reads that are absent (or commented out) in
#             config_default.yaml. The drift test checks each is referenced
#             in functions/.
#   deprecated: old keys with their replacement ('use'). Entries with a 'kind'
#             (configs from v0.5.0 on) are applied by upgrade_config_keys.m when
#             a config is loaded: rename (moved), convert (exact value
#             conversion, 'convert' names the converter), removed (dropped;
#             with 'keep', any other value is an error), error (no exact
#             conversion: the run stops). 'since' is the first release
#             without the key. Entries without a kind are converted by their
#             'source'; 'ignored: true' when PRESTUS no longer reads them.
#   sections: display labels and advanced flags for top-level groups.
#             locked: true shows the section read-only until its card is unlocked
#             icon: a glyph (ui/icons.py) left of the card title
#             (validated constants most studies must not change).
#             doc: the documentation page of the card (doc_x.md#anchor); tabs
#             have one too, and subtab_docs: {sub-tab label: page}; 'docs:'
#             (before 'display') gives single keys their own page.
#   tune_goals / tuning: what a key can be tuned for (speed, accuracy, …);
#             see the end of this file.
#   choice_icons / choice_figures: schematics for drop-down choices
#             (ui/choice_icons.py); see before 'tune_goals'.
#
# Keys found in config/config_calibration.yaml are recognised as belonging to
# the calibration workflow and are not reported as unknown.
#
# Field attributes:
#   kind:        str | int | float | number | numbers | vec3 | flag | bool |
#                tristate | dir | file | path | strlist | yaml
#                (flag = 0/1 integer shown as a checkbox; numbers = scalar or
#                row vector; yaml = free YAML text, e.g. int-or-'auto')
#   choices:     allowed values (rendered as a drop-down)
#   unit:        display unit
#   visible_if:  {key: <dotted path>, in: [values]}  (or not_in); a list of
#                such conditions shows the field when all of them hold;
#                {any_of: [...]} when one of them (a condition or a list) holds;
#                key '__n_transducers' is the number of transducers in the config
#   derived:     computed by PRESTUS; shown read-only, never written
#   help:        replaces the help text taken from config_default.yaml

sections:
  general:            {label: Subject, icon: subject, sub: Which participant this config simulates; the ID numbers the input and output files., doc: doc_parameters.md#subject-and-platform-subject_id-platform}
  simulation:         {label: Solvers, icon: wave, sub: Which solvers compute the acoustic field and the heating., doc: doc_backend.md}
  compute:            {label: Compute device, icon: chip, sub: 'Where the solver runs: CPU, GPU or compiled code.', virtual: true, doc: doc_kwave.md#solver-implementations-code_type}
  tx_geometry:        {label: Geometry, icon: elem_bowl, sub: 'Array type, frequency and element layout.', virtual: true, doc: doc_transducer.md#transducer-fields}   # array type, frequency, element geometry (group: tx_geometry)
  tx_drive:           {label: Drive and steering, icon: steer_1d, sub: 'Target intensity, focal depth, element amplitudes and phases, and steering.', virtual: true, doc: doc_transducer.md#amplitude-and-phases}
  coupling:           {label: Multi-transducer coupling, icon: coupling_coherent, sub: Whether several transducers add as pressure fields (coherent) or as intensities (async)., virtual: true, doc: doc_multitransducer.md#configuration}   # Sonication tab; only with several transducers (group: coupling)   # per-run drive: target ISPPA, amplitudes, phases, steering (group: tx_drive)   # the selected solvers' device fields (group: compute)
  path:               {label: Paths, icon: folder, sub: 'Where PRESTUS finds the anatomical images and segmentation, and where it writes results.', doc: doc_parameters.md#data-paths-path}
  startup:            {label: Environment, icon: wrench, sub: Locations of SimNIBS and the other external tools., doc: doc_parameters.md#environment-toolbox-paths-startup}
  io:                 {label: Input and output, icon: io, sub: 'Output naming, the optional outputs that are saved, and how existing outputs are reused.', doc: doc_outputs_reuse.md#overwrite-behaviour}
  calibration:        {label: Calibration conventions, icon: chart, sub: How the focal depth is referenced when calibration data are matched., advanced: true, doc: doc_calibration.md#focal-depth-convention-flhm}
  modules:            {label: Pipeline stages, icon: stages, sub: Which stages of the pipeline run., doc: doc_modules.md#pipeline-stages}
  report:             {label: Report, icon: report, sub: How the HTML report looks., advanced: true, doc: doc_parameters_run.md#report-report}
  study:              {label: Study, icon: people, sub: 'Several subjects or conditions, run from one table.', doc: doc_group_study-setup.md#study-setup}
  hpc:                {label: Where to run, icon: server, sub: Where the run executes and the cluster resources it requests., doc: doc_hpc.md#where-a-run-executes}
  snellius:           {label: Snellius partitions, icon: server, sub: GPU partitions on the Snellius cluster., advanced: true, doc: doc_parameters.md#snellius-gpu-partitions-snellius}
  analysis:           {label: Targeting analysis, icon: target, sub: Targeting accuracy against an intended MNI target or ROI., doc: doc_group.md#targeting-accuracy}
  transducer:         {label: Transducer, icon: tx_annular, sub: 'The device, chosen from the equipment library, and its calibration.', doc: doc_transducer_library.md#using-a-library-entry}
  placement:          {label: Placement, icon: target, sub: Where the transducer sits and where it focuses., doc: doc_placement.md#choosing-a-placement-mode}
  grid:               {label: Simulation grid, icon: grid, sub: 'Resolution, size and orientation of the simulation grid.', doc: doc_simulations-acoustic.md#spatial-and-temporal-sampling}
  segmentation:       {label: SimNIBS segmentation, icon: segmentation, sub: SimNIBS charm segmentation of the T1 (and T2 or UTE) into tissues., doc: doc_preproc.md#segmentation}
  headmodel:          {label: Segmentation refinement, icon: refine, sub: 'How the segmentation is cleaned up before simulation, e.g. how holes in the skull are filled.', doc: doc_preproc.md#from-segmentation-to-grid}
  head_smoothing:     {label: Smoothing, icon: smooth, sub: Smoothing of the tissue boundaries on the simulation grid., virtual: true, doc: doc_preproc.md#layer-mapping-and-smoothing}       # headmodel.smooth_* (group: head_smoothing)
  grid_refinement:    {label: Head padding, icon: pad, sub: Margin around the head and CSF expansion before the grid is cropped., virtual: true, doc: doc_preproc.md#cropping}  # headmodel.csf_expansion, head_pad_mm
  pct:                {label: CT-based skull mapping, icon: ct, sub: Subject-specific skull properties from a measured CT or a pseudo-CT made from a UTE image., doc: doc_pseudoCT.md}
  layers:             {label: Tissue layers, icon: layers, sub: Which SimNIBS labels make up each simulated tissue., advanced: true, locked: true, lock_note: 'These map the SimNIBS charm labels onto the simulated tissues (skin, skull, brain, …). The defaults match charm''s labels; change them only for a different segmentation or a phantom, and report the mapping you used.', doc: doc_preproc.md#layer-mapping-and-smoothing}   # the SimNIBS charm labels per tissue
  timing:             {label: Sonication protocol, icon: pulse, sub: 'Pulse duration, repetition and the length of the sonication.', doc: doc_simulations-thermal.md#protocol-timing}
  thermal:            {label: Thermal model, icon: thermometer, sub: 'Time step, sensors and thermal dose of the heating simulation.', doc: doc_simulations-thermal.md#step-temperature-and-sensor-settings}
  jwave:              {label: jwave options, icon: advanced, sub: Settings of the jwave solver., doc: doc_jwave.md#configuration-reference}
  babelbrain:         {label: BabelBrain options, icon: advanced, sub: Settings of the BabelBrain solver., doc: doc_babelbrain.md}
  elastic:            {label: Elastic skull options, icon: tissue_skull, sub: 'Shear waves in the skull, for the k-Wave elastic solver.', doc: doc_kwave.md#elastic-model-settings}
  time_reversal:      {label: Time reversal, icon: redo, sub: 'Refocusing, aberration report and pose search by time reversal.', advanced: true, doc: doc_time_reversal.md#main-settings}
  medium_properties:  {label: Tissue properties, icon: table, sub: 'Acoustic and thermal properties of each tissue, shown against the ITRUSST ranges.', locked: true, doc: doc_medium.md#default-tissue-properties}
  uncertainty:        {label: Uncertainty analysis, icon: range, sub: Repeats the run at the ITRUSST property bounds to bracket the result., virtual: true, doc: doc_uncertainty.md#basic-usage}  # simulation.uncertainty* (group: uncertainty)
  neuronav:           {label: Localite ingestion, icon: place_localite, sub: Importing recorded Localite neuronavigation poses., doc: doc_placement_neuronav_workflows.md#gui-workflow}   # Localite ingestion (top-level neuronav.*)

fields:
  # ── General ──────────────────────────────────────────────────────────
  subject_id: {kind: int, min: 0, max: 999}
  platform: {choices: [auto, slurm, qsub, matlab]}

  # ── Simulation ───────────────────────────────────────────────────────
  simulation.medium: {choices: [water, layered, phantom]}
  simulation.code_type:          # k-Wave runs: acoustic, thermal (with heating) or time reversal
    choices: [matlab_cpu, matlab_gpu, cpp_cpu, cpp_gpu, cpp_mlx]
    visible_if:
      any_of:
        - {key: acoustic_backend, not_in: [jwave, babelbrain]}
        - [{key: thermal_backend, not_in: [babelbrain]}, {key: modules.run_heating_sims, in: [1, true]}]
        - {key: time_reversal.enabled, in: [1, true]}
  simulation.precision: {choices: [single, double]}
  simulation.interactive: {kind: flag}
  simulation.debug: {kind: flag}
  simulation.debug_stages:
    kind: strlist
    visible_if: {key: simulation.debug, in: [1, true]}
    help: "Stages that write debug outputs: all, or some of preproc; medium; source; babelbrain."
  simulation.debug_figures: {kind: flag, visible_if: {key: simulation.debug, in: [1, true]}}
  simulation.debug_volumes: {kind: flag, visible_if: {key: simulation.debug, in: [1, true]}}
  simulation.transducer_coupling: {choices: [coherent, async], visible_if: {key: __n_transducers, not_in: [0, 1]}}
  grid.async_layout:
    choices: [shared, per_transducer]
    visible_if: [{key: __n_transducers, not_in: [0, 1]}, {key: simulation.transducer_coupling, in: [async]}]
  timing.async_schedule:
    choices: [pulses, trains, custom]
    visible_if: [{key: __n_transducers, not_in: [0, 1]}, {key: simulation.transducer_coupling, in: [async]}]
    help: "Async coupling: when each transducer fires; heating follows each one's own on-time. 'pulses': all use the timing block and take turns within each PRI (needs N × PD ≤ PRI). 'trains': take turns within each PTRI (needs N × PTD ≤ PTRI). 'custom': each transducer's start delay and timing overrides."

  # ── Paths & environment ──────────────────────────────────────────────
  path.sim: {kind: dir}
  # Only what the requested setup reads: anatomy and SimNIBS for a head model or a placement
  # that needs the segmentation (MNI, heuristic, neuronavigation, planning tools)
  path.anat: {kind: dir, visible_if: {any_of: [{key: simulation.medium, in: [layered, phantom]}, {key: placement.mode, not_in: [manual]}, {key: placement.manual.coordinate_space, in: [mni]}]}}
  path.seg: {kind: dir, visible_if: {any_of: [{key: simulation.medium, in: [layered, phantom]}, {key: placement.mode, not_in: [manual]}, {key: placement.manual.coordinate_space, in: [mni]}]}}
  path.t1_pattern: {visible_if: {any_of: [{key: simulation.medium, in: [layered, phantom]}, {key: placement.mode, not_in: [manual]}, {key: placement.manual.coordinate_space, in: [mni]}]}}
  path.t2_pattern: {visible_if: {key: simulation.medium, in: [layered]}}
  startup.simnibs_bin_path: {visible_if: {any_of: [{key: simulation.medium, in: [layered, phantom]}, {key: placement.mode, not_in: [manual]}, {key: placement.manual.coordinate_space, in: [mni]}]}}
  io.save_MNI: {visible_if: {key: simulation.medium, in: [layered]}}
  analysis: {visible_if: {key: simulation.medium, in: [layered, phantom]}}
  modules.run_targeting_analysis: {visible_if: {key: simulation.medium, in: [layered, phantom]}}
  modules.run_posthoc_water_sims: {visible_if: {key: simulation.medium, in: [layered, phantom]}}
  path.placement: {kind: dir}
  path.transducer_library: {kind: dir}
  path.localite*: {kind: dir}
  path.localite_t1_pattern: {kind: str, visible_if: {key: placement.mode, in: [localite]}}
  # Localite folders: read by placement.mode 'localite'; the export folder is written by heuristic placement
  path.localite_raw: {visible_if: {key: placement.mode, in: [localite]}}
  path.localite_post: {visible_if: {key: placement.mode, in: [localite]}}
  path.localite_t1: {visible_if: {key: placement.mode, in: [localite]}}
  path.localite_export: {visible_if: {key: placement.mode, in: [heuristic]}}
  path.localite: {visible_if: {key: placement.mode, in: [localite, heuristic]}}
  path.pct: {kind: dir, visible_if: [{key: pct.enabled, in: [1, true]}, {key: path.ct_pattern, in: ['', null]}]}
  path.ct_pattern: {kind: str, visible_if: [{key: simulation.medium, in: [layered]}, {key: pct.enabled, in: [1, true]}]}
  path.acoustic_input: {kind: file}
  startup.*_path: {kind: path}
  startup.modules_to_load: {kind: strlist}
  startup.paths_to_add: {kind: strlist}
  startup.subpaths_to_add: {kind: strlist}

  # ── I/O ──────────────────────────────────────────────────────────────
  io.overwrite_files: {choices: [never, always, force, ask]}
  io.cache_signature_check: {choices: [error, warn, 'off']}
  modules.run_water_baseline: {choices: [auto, 1, 0]}
  io.overwrite_simnibs: {kind: flag}
  io.save_*: {kind: flag}
  io.deface_plots: {kind: flag, visible_if: {key: simulation.medium, in: [layered]}}

  calibration.focal_reference: {choices: [peak, flhm_3db, flhm_6db]}

  # ── Modules ──────────────────────────────────────────────────────────
  modules.*: {kind: flag}
  report.style: {kind: str, choices: [instrument, classic, compact, paper]}
  report.segmentation: {kind: flag, visible_if: {key: simulation.medium, in: [layered]}}
  report.debug: {kind: flag, visible_if: {key: simulation.debug, in: [1, true]}}

  # ── HPC ──────────────────────────────────────────────────────────────
  hpc.name: {choices: [default, snellius]}
  hpc.memorylimit: {unit: GB}
  hpc.ld_library_path: {kind: path}
  # Scheduler settings mean nothing when the pipeline runs in this MATLAB session
  # Scheduler settings only when a run is submitted: 'slurm'/'qsub', or 'auto' on a computer
  # with sbatch/qsub or an SSH submission host (__scheduler, set by the main window)
  hpc.*: {visible_if: {any_of: [{key: platform, in: [slurm, qsub]}, [{key: platform, in: [auto]}, {key: __scheduler, in: [true]}]]}}
  hpc.posthoc_water_*: {visible_if: [{any_of: [{key: platform, in: [slurm, qsub]}, [{key: platform, in: [auto]}, {key: __scheduler, in: [true]}]]}, {key: modules.run_posthoc_water_sims, in: [1, true]}, {key: simulation.medium, in: [layered, phantom]}]}
  snellius: {visible_if: {key: hpc.name, in: [snellius]}}

  analysis.focus_area_radius: {unit: mm}
  analysis.target_mni_mm: {kind: vec3, unit: MNI mm}
  analysis.target_roi_mni: {kind: file}

  # ── Study (group) ────────────────────────────────────────────────────
  study.manifest: {kind: file}
  study.name: {kind: str}

  # ── Transducer ───────────────────────────────────────────────────────
  transducer.name: {kind: str}
  transducer.type: {kind: str, choices: [annular, matrix]}
  transducer.freq_hz: {kind: number, unit: Hz}
  transducer.target_isppa_wcm2: {kind: numbers, unit: W/cm²}
  transducer.trans_pos: {kind: vec3, group: placement}
  transducer.focus_pos: {kind: vec3, group: placement}
  transducer.focal_distance_ep: {kind: number, unit: mm, group: tx_drive, group_first: true}
  transducer.focal_distance_bowl: {kind: number, unit: mm, group: tx_drive, advanced: true}
  transducer.focal_distance_offset: {kind: number, unit: mm, derived: true, group: tx_drive, advanced: true}

  transducer.annular: {visible_if: {key: transducer.type, in: [annular]}}
  transducer.annular.*: {kind: numbers}
  transducer.annular.elem_n: {kind: int}
  transducer.annular.elem_id_mm: {unit: mm}
  transducer.annular.elem_od_mm: {unit: mm}
  transducer.annular.elem_p_amp: {unit: Pa}
  transducer.annular.elem_phase_deg: {unit: deg}
  transducer.annular.curv_radius_mm: {kind: number, unit: mm}
  transducer.annular.dist_geom_ep_mm: {kind: number, unit: mm}
  transducer.annular.depth_mm: {kind: number, unit: mm}

  transducer.matrix: {visible_if: {key: transducer.type, in: [matrix]}}
  transducer.matrix.*: {kind: number}
  transducer.matrix.elem_p_amp: {unit: Pa}
  transducer.matrix.steering: {kind: str, choices: [1D, 3D]}
  transducer.matrix.elem_shape: {kind: str, choices: [rect, disc, bowl]}
  transducer.matrix.*_mm: {unit: mm}
  transducer.matrix.is_curved: {kind: bool}
  transducer.matrix.is_clover_setup: {kind: bool}
  transducer.matrix.clover: {visible_if: {key: transducer.matrix.is_clover_setup, in: [true]}}
  transducer.matrix.clover.n_leaves: {kind: int}
  transducer.matrix.clover.ROC_parent: {unit: mm}
  transducer.matrix.clover.az_sep_deg: {unit: deg}
  transducer.matrix.clover.elevation_deg: {unit: deg}
  transducer.matrix.elem_phase_override_deg: {kind: numbers, unit: deg}
  transducer.matrix.use_steering_correction: {kind: bool}
  transducer.matrix.steering_correction: {kind: yaml}
  transducer.matrix.matrix_shape.type: {kind: str, choices: [define_here, extract_from_file]}
  transducer.matrix.matrix_shape.define_here: {visible_if: {key: transducer.matrix.matrix_shape.type, in: [define_here]}}
  transducer.matrix.matrix_shape.define_here.grid_shape.type: {kind: str, choices: [rect, fibonacci, fermat]}
  transducer.matrix.matrix_shape.define_here.grid_shape.rect: {visible_if: {key: transducer.matrix.matrix_shape.define_here.grid_shape.type, in: [rect]}}
  transducer.matrix.matrix_shape.define_here.grid_shape.fibonacci: {visible_if: {key: transducer.matrix.matrix_shape.define_here.grid_shape.type, in: [fibonacci]}}
  transducer.matrix.matrix_shape.define_here.grid_shape.fermat: {visible_if: {key: transducer.matrix.matrix_shape.define_here.grid_shape.type, in: [fermat]}}
  transducer.matrix.matrix_shape.define_here.grid_shape.*.elem_n*: {kind: int}
  transducer.matrix.matrix_shape.extract_from_file: {visible_if: {key: transducer.matrix.matrix_shape.type, in: [extract_from_file]}}
  transducer.matrix.matrix_shape.extract_from_file.file_path: {kind: file}
  transducer.matrix.matrix_shape.extract_from_file.start_row: {kind: int}
  transducer.matrix.matrix_shape.extract_from_file.start_col: {kind: int}
  transducer.matrix.matrix_shape.extract_from_file.rot_col: {kind: int}
  transducer.matrix.matrix_shape.extract_from_file.elem_n: {kind: int}
  transducer.matrix.matrix_shape.extract_from_file.select_random_subset: {kind: bool}
  transducer.matrix.matrix_shape.extract_from_file.subset.random_seed: {kind: bool}
  transducer.matrix.matrix_shape.extract_from_file.subset.subset_n_elements: {kind: int}
  transducer.matrix.matrix_shape.extract_from_file.project_on_new_ROC: {kind: bool}

  # ── Placement ────────────────────────────────────────────────────────
  placement.mode: {choices: [manual, localite, heuristic, mni, plantus, tus_entry]}
  placement.reuse: {choices: [auto, always, never]}
  placement.skin_gap_mm: {unit: mm}
  placement.manual: {visible_if: {key: placement.mode, in: [manual]}}
  placement.manual.coordinate_space: {choices: [voxel, ras, mni]}
  placement.localite: {visible_if: {key: placement.mode, in: [localite]}}
  placement.localite.enabled: {kind: flag}
  placement.localite.file: {kind: file}
  placement.localite.session: {kind: yaml}
  placement.localite.target: {kind: yaml, help: "Pick the series by target name (the ingested name, or the XML description in file mode); '' = use the series index. With several transducers, one name per transducer, e.g. [L_M1, R_M1]: transducer i uses entry i."}
  placement.localite.position: {kind: yaml, help: "Otherwise: index of the detected series (1-based, after the pulse-count filter); with several transducers one index per transducer, e.g. [1, 2]."}
  placement.localite.markertype: {choices: [TriggerMarkers, GUMMarkers]}
  placement.localite.reference_distance_mm: {unit: mm}
  placement.localite.tracker_to_bowl_mm: {kind: number, unit: mm}
  placement.heuristic: {visible_if: {key: placement.mode, in: [heuristic]}}
  placement.heuristic.*: {kind: number}
  placement.heuristic.mni_target_mm: {kind: vec3, unit: MNI mm}
  placement.heuristic.target_name: {kind: str}
  placement.heuristic.save_localite_t1: {kind: bool}
  placement.heuristic.left_ear_center: {kind: vec3, unit: voxels}
  placement.heuristic.right_ear_center: {kind: vec3, unit: voxels}
  placement.heuristic.ear_radius: {unit: mm}
  placement.heuristic.dist_close: {unit: mm}
  placement.mni: {visible_if: {key: placement.mode, in: [mni]}}
  placement.mni.trans_pos_mm: {kind: vec3, unit: MNI mm}
  placement.mni.focus_pos_mm: {kind: vec3, unit: MNI mm}
  placement.plantus: {visible_if: {key: placement.mode, in: [plantus]}}
  placement.plantus.*_mm: {unit: mm}
  placement.plantus.script_path: {kind: dir}
  placement.plantus.env_path: {kind: dir}
  placement.plantus.connectome_wb_path: {kind: dir}
  placement.plantus.mni_target_mm: {kind: vec3, unit: MNI mm}
  placement.plantus.focal_distance_list: {kind: numbers, unit: mm}
  placement.plantus.flhm_list: {kind: numbers, unit: mm}
  placement.plantus.max_angle_deg: {unit: deg}
  placement.plantus.interactive: {choices: [0, 1]}
  placement.plantus.skin_smoothing_iterations: {kind: int, min: 0}

  # ── Grid ─────────────────────────────────────────────────────────────
  grid.resolution_mm: {unit: mm}
  grid.default_dims: {kind: yaml, unit: grid points}
  grid.pml_size: {kind: yaml}
  grid.source_ppw: {kind: number}
  grid.use_kWaveArray: {kind: flag}
  grid.axisymmetric: {kind: flag}
  grid.axisymmetric_output: {choices: [auto, 2d, 3d], visible_if: {key: grid.axisymmetric, in: [1, true]}}
  grid.mode: {choices: [focal_axis, transducer_axis, ras_plus]}
  grid.focal_axis_min_norm: {visible_if: [{key: __n_transducers, not_in: [0, 1, 2]}, {key: grid.mode, in: [focal_axis]}]}

  # Head-model sections apply only to media built from a segmentation
  segmentation: {visible_if: {key: simulation.medium, in: [layered]}}
  headmodel: {visible_if: {key: simulation.medium, in: [layered]}}
  pct: {visible_if: {key: simulation.medium, in: [layered]}}
  layers: {visible_if: {key: simulation.medium, in: [layered, phantom]}}
  segmentation.use_qform: {kind: flag}
  segmentation.debug: {kind: flag}
  segmentation.noneck: {kind: flag}
  segmentation.settings_file: {kind: file}
  segmentation.deface: {kind: flag}

  headmodel.csf_expansion: {unit: mm, group: grid_refinement, group_first: true}
  headmodel.head_pad_mm: {unit: mm, group: grid_refinement}
  headmodel.smooth_method: {choices: [gaussian, box, 'off'], group: head_smoothing, group_first: true}
  headmodel.smooth_threshold_*: {visible_if: {key: headmodel.smooth_method, not_in: ['off']}, group: head_smoothing}
  headmodel.smooth_fwhm_mm: {unit: mm, visible_if: {key: headmodel.smooth_method, not_in: ['off']}, group: head_smoothing}
  headmodel.smooth_properties: {visible_if: {key: headmodel.smooth_method, not_in: ['off']}, group: head_smoothing}
  headmodel.skull_fill_method: {choices: [rubberwrap, imclose]}
  headmodel.skull_wrap_radius_mm: {unit: mm, visible_if: {key: headmodel.skull_fill_method, in: [rubberwrap]}}
  headmodel.skull_wrap_visualize: {kind: flag, visible_if: {key: headmodel.skull_fill_method, in: [rubberwrap]}}

  pct.enabled: {kind: flag}
  # The mapping settings apply only with pct.enabled
  # Pseudo-CT generation (UTE → HU) applies only without a measured CT (path.ct_pattern)
  pct.debug: {kind: flag, visible_if: [{key: pct.enabled, in: [1, true]}, {key: path.ct_pattern, in: ['', null]}]}
  pct.skull_mapping: {choices: [miscouridou, carpino, wiesinger, treeby, kosciessa, custom], visible_if: [{key: pct.enabled, in: [1, true]}, {key: path.ct_pattern, in: ['', null]}]}
  pct.custom_*: {visible_if: [{key: pct.enabled, in: [1, true]}, {key: path.ct_pattern, in: ['', null]}, {key: pct.skull_mapping, in: [custom]}]}
  pct.mapping_density: {choices: [k-plan, k-wave, marsac, marsac-babelbrain, aubry, air-tissue, none], visible_if: {key: pct.enabled, in: [1, true]}}
  pct.density_calibration: {visible_if: [{key: pct.enabled, in: [1, true]}, {key: pct.mapping_density, in: [k-plan]}]}
  pct.mapping_soundspeed: {choices: [k-plan, marsac, aubry, webb, pichardo, mcdannold, none], visible_if: {key: pct.enabled, in: [1, true]}}
  pct.mapping_attenuation: {choices: [k-plan, mueller, aubry, webb, pichardo, mcdannold, none], visible_if: {key: pct.enabled, in: [1, true]}}

  layers.*: {kind: numbers}

  # ── Timing & thermal ─────────────────────────────────────────────────
  timing.*: {unit: s}
  timing.equal_step_duration: {kind: flag, unit: ''}
  # Thermal settings apply only when the thermal simulation runs
  thermal: {visible_if: {key: modules.run_heating_sims, in: [1, true]}}
  thermal.cem43_iso:
    kind: flag
    choices: [0, 1]
    choice_labels: {0: "k-Wave (kWaveDiffusion)", 1: "ISO 14708-3 / ITRUSST"}
    choice_math:      # doc_simulations-thermal.md#thermal-dose-cem43-calculation; Δt in s, T in °C
      0:
        - '\mathrm{CEM}_{43} = \sum_t \frac{\Delta t}{60}\, R^{43 - T}'
        - 'R = 0\;(T < 37),\quad 0.25\;(37 \leq T < 43),\quad 0.5\;(T \geq 43)'
      1:
        - '\mathrm{CEM}_{43} = \sum_t \frac{\Delta t}{60}\, R^{43 - T}'
        - 'R = 0\;(T < 39),\quad 0.25\;(39 \leq T < 43),\quad 0.5\;(T \geq 43\ \mathrm{or}\ T_\mathrm{max} \geq 43)'
        - '\mathrm{CEM}_{43} = \infty\;\;(T\ \mathrm{or}\ T_\mathrm{max} \geq 57)'
        - '> R stays 0.5 once 43 °C has been reached (no thermotolerance after 43 °C); above 57 °C the ISO formula is not valid, so PRESTUS flags the voxel.'
  thermal.temp_0.*: {unit: °C}
  thermal.log_thermal_updates: {kind: flag}
  thermal.pulse_model: {choices: [train_averaged, pulse_resolved]}
  thermal.max_focal_plane_gb: {unit: GB}

  # ── Backends ─────────────────────────────────────────────────────────
  jwave: {visible_if: {key: acoustic_backend, in: [jwave]}}
  # Time-reversal options apply only with time_reversal.enabled; search/workflow settings only with their own switch
  time_reversal.apply_phases: {visible_if: {key: time_reversal.enabled, in: [1, true]}}
  time_reversal.save_field: {visible_if: {key: time_reversal.enabled, in: [1, true]}}
  time_reversal.only: {visible_if: {key: time_reversal.enabled, in: [1, true]}}
  time_reversal.placement_search.*: {visible_if: {key: time_reversal.placement_search.enabled, in: [1, true]}}
  time_reversal.placement_search: {visible_if: {key: time_reversal.enabled, in: [1, true]}}
  time_reversal.placement_search.enabled: {visible_if: ~}
  time_reversal.pose_workflow.*: {visible_if: {key: time_reversal.pose_workflow.enabled, in: [1, true]}}
  time_reversal.pose_workflow.enabled: {visible_if: ~}
  time_reversal.placement_search.jitter_mm: {kind: yaml, unit: mm}
  time_reversal.placement_search.jitter_mode: {kind: str, choices: [grid, scalp]}
  grid.water_baseline_grid: {kind: str, choices: [beam, full]}
  time_reversal.pose_workflow.poses: {kind: yaml, help: "Pose ids of the pose table to verify as well, e.g. [12, 40]."}
  time_reversal.pose_workflow.aim: {kind: str, choices: [corrected, geometric, both]}
  time_reversal.pose_workflow.verify_fov: {kind: str, choices: [partial, full, config]}
  time_reversal.pose_workflow.rank_by: {kind: str, choices: [target_intensity, focus_error]}
  time_reversal.pose_workflow.max_focus_error_mm: {kind: yaml, unit: mm}
  time_reversal.pose_workflow.search_memorylimit: {kind: yaml, unit: GB}
  jwave.python_env: {kind: path}
  jwave.python_env_gpu: {kind: path, visible_if: {key: jwave.use_gpu, not_in: [false, 0]}}
  jwave.use_gpu: {kind: tristate}
  jwave.solver: {choices: [helmholtz, pseudo_spectral, finite_differences]}
  babelbrain: {visible_if: {key: acoustic_backend, in: [babelbrain]}}
  elastic: {visible_if: {key: acoustic_backend, in: [kwave_elastic]}}
  elastic.shear_mapping: {choices: [pichardo, 'off']}
  elastic.shear_density_min: {unit: kg/m³}
  elastic.alpha_coeff_shear: {unit: dB/(cm·MHz^y)}
  elastic.alpha_coeff_long: {unit: dB/(cm·MHz^y)}
  elastic.long_attenuation: {choices: [elastic, medium]}
  babelbrain.computing_backend: {choices: [auto, cuda, opencl, metal, cpu]}
  babelbrain.shear: {choices: ['off', prestus_elastic]}
  babelbrain.focal_calibration_target: {choices: [flhm_center, peak]}
  babelbrain.python_env: {kind: path}
  # BabelBrain's CT path needs the pseudo-CT, which grid_tissue_setup.m loads only with pct.enabled
  babelbrain.ct_mapping: {choices: [Webb-Marsac, Aubry, Pichardo, McDannold, Marsac-Aubry, Pichardo-Marsac, McDannold-Marsac], visible_if: {key: pct.enabled, in: [1, true]}}
  babelbrain.air_regions: {kind: bool, visible_if: [{key: pct.enabled, in: [1, true]}, {key: babelbrain.ct_mapping, not_in: ['', null]}]}
  babelbrain.air_hu_window: {kind: numbers, unit: HU, visible_if: [{key: pct.enabled, in: [1, true]}, {key: babelbrain.ct_mapping, not_in: ['', null]}, {key: babelbrain.air_regions, in: [1, true]}]}
  babelbrain.air_keep_boundary: {kind: bool, visible_if: [{key: pct.enabled, in: [1, true]}, {key: babelbrain.ct_mapping, not_in: ['', null]}, {key: babelbrain.air_regions, in: [1, true]}]}

  medium_properties.*.sound_speed: {unit: m/s}
  medium_properties.*.density: {unit: kg/m³}
  medium_properties.*.thermal_conductivity: {unit: W/m/°C}
  medium_properties.*.specific_heat_capacity: {unit: J/kg/°C}
  medium_properties.*.absorption_coeff: {kind: number, unit: dB/(cm·MHz^y), help: "Alternative to absorption_fraction: set one of the two per tissue"}

