extra:
  # Set by the pipelines on the per-run parameters (sequential_pipeline, multi_isppa_pipeline,
  # async_transducer_pipeline, uncertainty_pipeline); listed so a config that sets them is not
  # flagged as unknown. checks.followup_issues validates the adopted_* files.
  io.adopted_heatmap:
    kind: str
    default: []
    derived: true
    help: Temperature map a sequential follow-up starts from (sequential_pipeline sets it to the previous run's _heating_end map); used only when the file exists.
  io.adopted_cem43:
    kind: str
    default: []
    derived: true
    help: CEM43 map a sequential follow-up starts from (sequential_pipeline); used only when the file exists.
  io.adopted_cem43_iso:
    kind: str
    default: []
    derived: true
    help: Isoeffective CEM43 map a sequential follow-up starts from (sequential_pipeline); used only when the file exists.
  io.preproc_affix:
    kind: str
    default: []
    derived: true
    help: Affix of the preprocessing cache to load (set by the multi-ISPPA, async, sequential and uncertainty pipelines so their runs reuse one grid).
  io.medium_affix:
    kind: str
    default: []
    derived: true
    help: Affix of the medium cache (set by uncertainty_pipeline for each property variant).
  io.acoustic_cache_affix:
    kind: str
    default: []
    derived: true
    help: Affix of the acoustic cache to load (set by multi_isppa_pipeline so all intensities reuse one acoustic simulation, and by async_transducer_pipeline for the combined field).
  io.thermal_cache_affix:
    kind: str
    default: []
    derived: true
    help: Affix of the thermal cache (set by sequential_pipeline to the follow-up's own output affix).
  babelbrain.tight_narrow_beam:
    kind: bool
    default: []
    help: BabelBrain narrow-beam domain (saves compute; the pre-focal field is not emitted). Ignored when grid.acoustic_fov_length_mm is set.
  transducer.timing_offset_s:
    kind: number
    default: []
    unit: s
    visible_if: [{key: __n_transducers, not_in: [0, 1]}, {key: simulation.transducer_coupling, in: [async]}, {key: timing.async_schedule, in: [custom]}]
    help: "Async 'custom' schedule: delay of this transducer's first pulse [s]. Empty = 0."
  transducer.timing.pd:
    kind: number
    default: []
    unit: s
    visible_if: [{key: __n_transducers, not_in: [0, 1]}, {key: simulation.transducer_coupling, in: [async]}, {key: timing.async_schedule, in: [custom]}]
    help: "Async 'custom' schedule: this transducer's pulse duration [s], replacing timing.pd. Empty = the timing block's."
  transducer.timing.pri:
    kind: number
    default: []
    unit: s
    visible_if: [{key: __n_transducers, not_in: [0, 1]}, {key: simulation.transducer_coupling, in: [async]}, {key: timing.async_schedule, in: [custom]}]
    help: "Async 'custom' schedule: this transducer's pulse repetition interval [s], replacing timing.pri. Empty = the timing block's."
  transducer.timing.ptd:
    kind: number
    default: []
    unit: s
    visible_if: [{key: __n_transducers, not_in: [0, 1]}, {key: simulation.transducer_coupling, in: [async]}, {key: timing.async_schedule, in: [custom]}]
    help: "Async 'custom' schedule: this transducer's pulse train duration [s], replacing timing.ptd. Empty = the timing block's."
  transducer.timing.ptri:
    kind: number
    default: []
    unit: s
    visible_if: [{key: __n_transducers, not_in: [0, 1]}, {key: simulation.transducer_coupling, in: [async]}, {key: timing.async_schedule, in: [custom]}]
    help: "Async 'custom' schedule: this transducer's pulse train repetition interval [s], replacing timing.ptri. Empty = the timing block's."
  transducer.timing.ptrd:
    kind: number
    default: []
    unit: s
    visible_if: [{key: __n_transducers, not_in: [0, 1]}, {key: simulation.transducer_coupling, in: [async]}, {key: timing.async_schedule, in: [custom]}]
    help: "Async 'custom' schedule: how long this transducer sonicates [s] (its pulse train repetition duration), replacing timing.ptrd. Empty = the timing block's."
  simulation.uncertainty:
    kind: bool
    default: false
    help: Run the uncertainty pipeline (medium property variants) instead of a single simulation; see doc_uncertainty.md.
  transducer.align_to_focus:
    kind: bool
    default: []
    derived: true
    help: Set by the transducer validators (annular and 1D-steered matrix → true); a configured value is overwritten.
  transducer.tx_calibration:
    kind: yaml
    default: {}
    help: "Calibration record of the drive, written by the calibration pipeline and the transducer library; isppa_wcm2 is the free-water ISPPA that elem_p_amp produces. A target_isppa_wcm2 that differs from it rescales the results."
  timing.pulse_ramp_dur:
    kind: number
    default: 0
    unit: s
    help: "Rise (= fall) duration of the amplitude ramp at the start and end of each pulse [s]; 0 = rectangular pulse. Used for the pulse-average intensity (Ipa = factor × Itp)."
  timing.pulse_ramp_shape:
    kind: str
    default: linear
    choices: [linear, tukey]
    unit: ''              # not a duration (timing.* defaults to s)
    help: "Shape of the pulse ramp: 'linear' or 'tukey' (raised cosine)."
  transducer.annular.elem_phase_rad:
    kind: numbers
    default: []
    unit: rad
    visible_if: {key: transducer.type, in: [annular]}
    help: Source phase of each element in radians; alternative to elem_phase_deg.
  acoustic_backend:
    kind: str
    default: kwave
    choices: [kwave, kwave_elastic, babelbrain, jwave]
    choice_labels: {kwave: kwave, kwave_elastic: "kwave_elastic (experimental)", babelbrain: "babelbrain (experimental)", jwave: "jwave (experimental)"}
    help: "Acoustic solver: 'kwave' (default) | 'kwave_elastic' (shear waves in skull) | 'babelbrain' | 'jwave'"
  thermal_backend:
    kind: str
    default: kwave
    choices: [kwave, babelbrain]
    choice_labels: {kwave: kwave, babelbrain: "babelbrain (experimental)"}
    visible_if: {key: modules.run_heating_sims, in: [1, true]}
    help: "Thermal solver: 'kwave' (default) | 'babelbrain' (requires acoustic_backend: 'babelbrain')"
  transducer.serial:
    kind: str
    default: ''
    help: Equipment serial (an entry in config/equipment); geometry is filled in from the library.
  transducer.library_path:
    kind: dir
    default: ''
    help: Folder with your own calibration entries (e.g. from refine_transducer_library), used when it holds one for this transducer, and your own equipment entries (*_transducer.yaml), which add or replace transducers.
  transducer.combo.ds_serial:
    kind: str
    default: ''
    help: Driving-system serial; selects the calibration entry for this transducer with this driving system.
  transducer.max_elem_p_amp:
    kind: number
    unit: Pa
    help: "Largest drive your driving system delivers (as elem_p_amp). A library drive above it warns, with the largest ISPPA reachable at that depth. Empty: the drive_limit of the combo in the equipment entry, if any."
  grid.z_beyond_focus_mm:
    kind: number
    default: 40
    unit: mm
    help: Extra axial length beyond the focal depth when acoustic_fov_length_mm or default_dims is 'auto', and of BabelBrain's narrow-beam domain.
  grid.water_margin_mm:
    kind: number
    default: 5
    unit: mm
    help: Lateral margin on each side of the aperture when default_dims is 'auto'.
  grid.acoustic_fov_diameter_mm:
    kind: yaml
    default: []
    unit: mm
    help: Lateral diameter of the beam-axis-aligned acoustic sub-grid; 'auto' = outermost element diameter.
  grid.acoustic_fov_length_mm:
    kind: yaml
    default: []
    unit: mm
    help: Axial length of the acoustic sub-grid; 'auto' = focal depth + z_beyond_focus_mm.
  grid.thermal_use_acoustic_fov:
    kind: flag
    default: 0
    help: Run the thermal simulation within the acoustic FOV as well (faster, less accurate cooling boundary).
  grid.thermal_resolution_mm:
    kind: number
    default: []
    unit: mm
    help: Grid resolution for the thermal simulation only; empty reuses the acoustic resolution.
  grid.thermal_fov_mm:
    kind: number
    default: []
    unit: mm
    help: Independent thermal FOV around the focus, independent of the acoustic FOV.
  grid.steady_state_transits:
    kind: number
    default: 1
    help: Domain-diagonal one-way transits (at minimum sound speed) before recording starts.
  grid.steady_state_num_periods:
    kind: number
    default: 3
    help: Number of trailing wave periods recorded as the steady-state window.
  grid.pml_size_range:
    kind: numbers
    default: [10, 40]
    unit: grid points
    help: Search range [min, max] of pml_size 'auto' (k-Wave getOptimalPMLSize).
  grid.pml_alpha:
    kind: number
    default: []
    help: PML absorption in Nepers per grid point; empty uses k-Wave's default (2).
  grid.bli_tolerance:
    kind: number
    default: []
    help: kWaveArray band-limited interpolation tolerance; empty uses 0.1 (3D) or 0.01 (axisymmetric).
  grid.bli_upsampling_rate:
    kind: number
    default: []
    help: kWaveArray integration-point upsampling rate; empty uses 10 (3D) or 100 (axisymmetric).
  grid.source_ppp:
    kind: number
    default: []
    help: Time steps per wave period; when set, replaces the PPW/CFL derivation of the time step.
  grid.sim_time_us:
    kind: number
    default: []
    unit: us
    help: Fixed simulation duration; when set, replaces steady_state_transits.
  grid.origin_ras_mm:
    kind: vec3
    default: []
    unit: RAS mm
    help: RAS mm of voxel [1,1,1] for spatially registered phantom/water outputs.
  placement.tus_entry.script_path:
    kind: file
    default: ''
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Full path to TUS_entry.R.
  placement.tus_entry.env_path:
    kind: dir
    default: ''
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Conda environment containing Rscript.
  placement.tus_entry.scalp_mask:
    kind: file
    default: ''
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Optional NIfTI head/scalp mask in the T1 grid (nonzero = head); default SimNIBS final_tissues.nii.gz. Filled into a solid head mask in the cache.
  placement.tus_entry.target_mask:
    kind: file
    default: ''
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Binary NIfTI target mask; when empty a sphere is built from focus_pos or mni_target_mm.
  placement.tus_entry.mni_target_mm:
    kind: vec3
    default: []
    unit: MNI mm
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: MNI target coordinate; defaults to transducer.focus_pos.
  placement.tus_entry.return_candidates:
    kind: bool
    default: false
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Save the full ranked candidate list as RDS.
  placement.tus_entry.target_name:
    kind: str
    default: 'target'
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Target label, used in the run folder and file names.
  placement.tus_entry.target_mask_radius_mm:
    kind: number
    default: 5
    unit: mm
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Radius of the spherical target mask built when target_mask is empty.
  placement.tus_entry.exclu_mask:
    kind: file
    default: ''
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Optional binary NIfTI of regions trajectories must avoid (T1 grid).
  placement.tus_entry.minimal_distance_cm:
    kind: number
    default: 4.24
    unit: cm
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Smallest scalp-target depth. Set to the transducer's steering range.
  placement.tus_entry.maximal_distance_cm:
    kind: number
    default: 7.46
    unit: cm
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Largest scalp-target depth. Set to the transducer's steering range.
  placement.tus_entry.transducer_size_cm:
    kind: number
    default: 6.4
    unit: cm
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Transducer outer diameter (rim used for the coupling score).
  placement.tus_entry.voxel_size_cm:
    kind: number
    default: []
    unit: cm
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Voxel size TUS_entry uses for distances; empty = the mean T1 voxel size.
  placement.tus_entry.resolution_cm:
    kind: number
    default: 0.33
    unit: cm
    visible_if: {key: placement.mode, in: [tus_entry]}
    help: Spatial decimation step of the candidate search.
  # Scanner-specific coefficients of the 'webb' skull mappings (medium_pct_soundspeed / _attenuation);
  # empty = the GE 120 kVp, B-kernel values of Webb et al.
  pct.webb_sos_slope:
    kind: number
    default: []
    visible_if: [{key: pct.enabled, in: [1, true]}, {key: pct.mapping_soundspeed, in: [webb]}]
    help: "Slope of the 'webb' sound-speed line [m/s per HU] (Webb et al. 2018, Tables I and II). Empty = 0.75."
  pct.webb_sos_intercept:
    kind: number
    default: []
    unit: km/s
    visible_if: [{key: pct.enabled, in: [1, true]}, {key: pct.mapping_soundspeed, in: [webb]}]
    help: "Intercept of the 'webb' sound-speed line [km/s]: c = slope × HU + 1000 × intercept [m/s]. Empty = 1.32."
  pct.webb_att_alpha0:
    kind: number
    default: []
    visible_if: [{key: pct.enabled, in: [1, true]}, {key: pct.mapping_attenuation, in: [webb]}]
    help: "α₀ of the 'webb' attenuation model α₀ · exp(c · HU) (Webb et al. 2021, Table IV). Empty = 26."
  pct.webb_att_beta:
    kind: number
    default: []
    visible_if: [{key: pct.enabled, in: [1, true]}, {key: pct.mapping_attenuation, in: [webb]}]
    help: "Frequency exponent β of the 'webb' attenuation model; becomes the skull alpha_power. Empty = 1.3."
  pct.webb_att_c:
    kind: number
    default: []
    unit: 1/HU
    visible_if: [{key: pct.enabled, in: [1, true]}, {key: pct.mapping_attenuation, in: [webb]}]
    help: "Exponent coefficient c of the 'webb' attenuation model [1/HU]. Empty = -0.0016."

# ── Tabs of the main window ────────────────────────────────────────────
# Each tab shows its sections as collapsible groups. Sections marked
# 'advanced' above, and fields marked 'advanced' below, are hidden until
# "Show advanced options" is ticked on that tab (they stay visible while
# they hold a value). Sections not listed here go to the Setup tab.
tabs:
  - key: setup
    label: Setup
    intro: Subject, input and output folders, software locations and how outputs are written.
    sections: [general, path, startup, io]
    doc: doc_configuration.md
  - key: transducer
    label: Transducer
    intro: The device and driving system, its geometry, drive level and focal depth.
    sections: [transducer, tx_geometry, tx_drive, calibration]
    doc: doc_nexus_tabs.md#transducer-tab
    subtab_docs: {Calibration: doc_nexus_calibration-localite.md#calibration-page}
  - key: placement
    label: Placement
    intro: Where the transducer sits and where it focuses, from coordinates, neuronavigation or planning tools.
    sections: [placement, neuronav]
    doc: doc_nexus_tabs.md#placement-viewer
    subtab_docs: {Settings: doc_placement.md#choosing-a-placement-mode, Viewer: doc_nexus_tabs.md#placement-viewer, Beam axis: doc_nexus_tabs.md#placement-viewer, 3D: doc_nexus_tabs.md#placement-viewer, Localite: doc_nexus_calibration-localite.md#localite-page, PlanTUS: doc_placement_plantus.md#running-plantus, TUS entry: doc_placement_tus_entry.md}
  - key: medium
    label: Medium
    intro: What the beam travels through. Choose the medium, then how the head model is built from the segmentation, the tissue properties against their ITRUSST bounds, and the CT-based skull mapping (measured CT or UTE pseudo-CT).
    sections: [segmentation, headmodel, head_smoothing, grid_refinement, layers, medium_properties, uncertainty, pct]
    doc: doc_medium.md
    subtab_docs: {Head model: doc_preproc.md, Skull CT: doc_pseudoCT.md}
  - key: sonication
    label: Sonication
    intro: The pulse protocol and, when the thermal simulation runs, the thermal model.
    sections: [timing, coupling, thermal]
    doc: doc_nexus_tabs.md#timing-diagram-and-tus-calculator
  - key: solver
    label: Solver
    intro: The acoustic and thermal solvers, the simulation grid and the solver-specific options.
    sections: [simulation, compute, grid, jwave, babelbrain, elastic, time_reversal]
    doc: doc_backend.md
  - key: study
    label: Study
    intro: Many subjects with per-run settings, targeting accuracy and the group report.
    sections: [study, analysis]
    doc: doc_nexus_tabs.md#study-tab
  - key: run
    label: Run
    intro: Pipeline stages, where to run (this computer or HPC), and the run log.
    sections: [modules, report, hpc, snellius]
    doc: doc_nexus_tabs.md#run-tab
    subtab_docs: {Where to run: doc_hpc.md#where-a-run-executes, Stages: doc_modules.md}
  - key: results
    label: Results
    intro: Acoustic/thermal maps, the HTML report and the output table from the last run.
    sections: []
    doc: doc_nexus_tabs.md#results-tab

# ── Docs: a key's own page, where it is more specific than its section's ──
# 'doc:' on a section or tab names the page (doc/*.md, '#anchor' optional) the
# card's ↗ button, the field help and Help ▸ Docs for this tab open; 'docs:'
# overrides it per key (same pattern rules as 'fields'; the last match wins).
# test_docs.py checks that every page is in the mkdocs nav and every anchor exists.
docs:
  grid.mode: doc_preproc.md#orientation
  grid.acoustic_fov_*: doc_limited_fov.md#fov-box-geometry
  grid.z_beyond_focus_mm: doc_limited_fov.md#fov-box-geometry
  simulation.async_grid_mode: doc_multitransducer_async.md#grid-geometry-mode
  simulation.transducer_coupling: doc_multitransducer_async.md#async-configuration
  transducer.target_isppa_wcm2: doc_simulations-acoustic.md#isppa-targeting
  modules.run_water_baseline: doc_simulations-acoustic.md#isppa-targeting
  placement.mode: doc_placement.md#choosing-a-placement-mode
  placement.manual*: doc_placement.md#manual-coordinate-selection
  placement.heuristic*: doc_placement_heuristic.md
  placement.mni*: doc_placement_mni.md#how-a-position-is-resolved
  placement.localite*: doc_placement_neuronav_coordinates.md
  placement.plantus*: doc_placement_plantus.md#running-plantus
  placement.tus_entry*: doc_placement_tus_entry.md#required-configuration
  simulation.medium: doc_medium.md#choosing-the-medium
  io.overwrite_files: doc_outputs_reuse.md#overwrite-behaviour
  io.cache_signature_check: doc_outputs_reuse.md#cache-reuse-checks
  io.acoustic_cache_remap: doc_outputs_reuse.md#cache-reuse-checks

# ── Display: labels, advanced flags, placement in the forms ───────────
# Same pattern rules as 'fields' (applied after them). 'label' replaces the
# key as the field name (the key stays in the tooltip); 'help' replaces the
# config_default.yaml comment; 'group' shows a key in another section.
display:
  # General
  subject_id: {label: Subject ID}
  platform: {label: Run on, group: hpc, group_first: true, help: "Where the pipeline runs: 'auto' submits to SLURM/qsub when a scheduler is found, 'matlab' runs in this MATLAB session (recommended for testing), 'slurm'/'qsub' force a scheduler."}
  acoustic_backend: {label: Acoustic solver, group: simulation, group_first: true}
  thermal_backend: {label: Thermal solver, group: simulation, group_first: true}

  # Simulation
  simulation.medium: {label: Medium, group: __medium__, help: "'layered': head model from the SimNIBS segmentation (skin, skull, brain, …); 'water': free-field simulation in water; 'phantom': a user-defined phantom."}
  simulation.code_type: {label: k-Wave backend, group: compute, help: "Where k-Wave computes (acoustic and thermal k-Wave stages, time reversal): 'matlab_gpu' / 'matlab_cpu' (MATLAB), 'cpp_gpu' / 'cpp_cpu' (k-Wave's C++ binaries, fastest), 'cpp_mlx' (Apple Silicon GPU). A GPU choice also requests a GPU for cluster jobs."}
  jwave.use_gpu: {label: jwave GPU, group: compute}
  babelbrain.computing_backend: {label: BabelBrain backend, group: compute}
  babelbrain.device_name: {label: BabelBrain device, group: compute}
  simulation.precision: {label: Numerical precision, advanced: true}
  simulation.interactive: {label: Interactive mode, advanced: true}
  simulation.debug: {label: Debug outputs, advanced: false, group: modules}
  simulation.debug_stages: {label: Debug stages, advanced: true, group: modules}
  simulation.debug_figures: {label: Debug figures, advanced: true, group: modules}
  simulation.debug_volumes: {label: Debug volumes (large), advanced: true, group: modules}
  simulation.transducer_coupling: {label: Coupling, group: coupling}
  grid.async_layout: {label: "Grid for async runs", advanced: true, group: coupling}
  timing.async_schedule: {label: Firing schedule, group: coupling}
  transducer.timing_offset_s: {label: "Start delay", group: coupling, advanced: true}
  transducer.timing.pd: {label: "Pulse duration, this transducer", group: coupling, advanced: true}
  transducer.timing.pri: {label: "Pulse repetition interval, this transducer", group: coupling, advanced: true}
  transducer.timing.ptd: {label: "Pulse train duration, this transducer", group: coupling, advanced: true}
  transducer.timing.ptri: {label: "Pulse train repetition interval, this transducer", group: coupling, advanced: true}
  transducer.timing.ptrd: {label: "Sonication duration, this transducer", group: coupling, advanced: true}
  simulation.uncertainty: {label: Uncertainty analysis, group: uncertainty, group_first: true}
  simulation.uncertainty_temp_high: {group: uncertainty, label: Temp-H medium file (max. heating), help: "Medium properties of the Temp-H variant, the ITRUSST bounds that maximise brain heating: a YAML file with a medium_properties block (absolute path, or a file name in config/uncertainty/). Empty = the shipped config_medium_temp_high.yaml. Tissues and properties the file does not list keep the default medium properties."}
  simulation.uncertainty_temp_low: {group: uncertainty, label: Temp-L medium file (min. heating), help: "Medium properties of the Temp-L variant, the ITRUSST bounds that minimise brain heating: a YAML file with a medium_properties block (absolute path, or a file name in config/uncertainty/). Empty = the shipped config_medium_temp_low.yaml. Tissues and properties the file does not list keep the default medium properties."}
  simulation.uncertainty_trans_high: {group: uncertainty, label: Trans-H medium file (max. intensity), help: "Medium properties of the Trans-H variant, the ITRUSST bounds that maximise brain intensity: a YAML file with a medium_properties block (absolute path, or a file name in config/uncertainty/). Empty = the shipped config_medium_trans_high.yaml. Tissues and properties the file does not list keep the default medium properties. Acoustic only: the pipeline runs no heating for this variant, so thermal properties are not used."}
  simulation.uncertainty_trans_low: {group: uncertainty, label: Trans-L medium file (min. intensity), help: "Medium properties of the Trans-L variant, the ITRUSST bounds that minimise brain intensity: a YAML file with a medium_properties block (absolute path, or a file name in config/uncertainty/). Empty = the shipped config_medium_trans_low.yaml. Tissues and properties the file does not list keep the default medium properties. Acoustic only: the pipeline runs no heating for this variant, so thermal properties are not used."}

  # Paths
  path.anat: {label: Anatomical images folder}
  path.sim: {label: Simulation outputs folder}
  path.seg: {label: SimNIBS segmentations folder}
  path.t1_pattern: {label: T1 file pattern}
  path.t2_pattern: {label: T2 / UTE file pattern}
  path.localite_raw: {label: Localite exports (raw), group: placement}
  path.localite_post: {label: Ingested Localite markers, group: placement}
  path.localite_t1: {label: Localite planning T1 folder, group: placement, advanced: true}
  path.localite_t1_pattern: {label: Localite planning T1 pattern, group: placement, advanced: true}
  path.localite_export: {label: Localite export folder, group: placement, advanced: true}
  path.localite: {label: Localite folder (deprecated), group: placement, advanced: true}
  path.pct: {label: Pseudo-CT output folder, advanced: true, group: pct}
  path.ct_pattern: {label: Measured CT file pattern (empty = pseudo-CT from UTE), group: pct, group_first: true}
  path.acoustic_input: {label: Start from pressure map (NIfTI), advanced: true}
  path.placement: {label: Placement output folder, group: placement, advanced: true}
  path.transducer_library: {label: Own transducer library (project), advanced: true}

  # Environment
  startup.simnibs_bin_path: {label: SimNIBS bin folder}
  startup.matlab_bin_path: {label: MATLAB binary (HPC pCT), advanced: true}
  startup.fsl_bin_path: {label: FSL bin folder, advanced: true}
  startup.ants_bin_path: {label: ANTs bin folder, advanced: true}
  startup.ants_simg_path: {label: ANTs Singularity image, advanced: true}
  startup.modules_to_load: {label: HPC modules to load, advanced: true}
  startup.paths_to_add: {label: Extra MATLAB paths, advanced: true}
  startup.subpaths_to_add: {label: Extra MATLAB paths (recursive), advanced: true}

  # I/O
  io.output_affix: {label: Output name affix}
  io.overwrite_files: {label: Overwrite existing outputs, advanced: true, help: "What to do when outputs already exist: 'never' reuses them; 'always' recomputes the outputs (chained pipelines reuse intermediate caches); 'force' also recomputes intermediate stages; any other value asks. See doc_outputs_reuse.md#overwrite-behaviour."}
  io.cache_signature_check: {label: Check reused caches, advanced: true, help: "When a grid or medium cache is reused (overwrite 'never', or intermediate stages of chained pipelines) but was built with different settings: 'error' stops, 'warn' reuses it anyway, 'off' skips the check. See doc_outputs_reuse.md#cache-reuse-checks."}
  io.acoustic_cache_remap: {label: Remap acoustic cache to this grid, advanced: true, help: "A reused acoustic cache written on a different grid (e.g. after a head-model change): off re-simulates; on maps the field onto this grid through world space, pressures as p^2, and records the mapping. The field keeps the cache run's head model. See doc_outputs_reuse.md#cache-reuse-checks."}
  io.overwrite_simnibs: {label: Re-run SimNIBS segmentation, advanced: true}
  io.save_*: {advanced: true}
  io.save_MNI: {label: Also save MNI-space NIfTIs, advanced: false}
  io.save_matrices: {label: Save intermediate matrices (fallback)}
  io.save_source_matrices: {label: Save source matrices}
  io.save_acoustic_matrices: {label: Save acoustic matrices (large)}
  io.save_thermal_matrices: {label: Save thermal matrices}
  io.save_heatingvideo: {label: Save heating video}
  io.save_property_maps: {label: Save medium property maps}
  io.save_Ipa: {label: Save pulse-average intensity map}
  io.save_Ita: {label: Save time-average intensity map}
  io.save_p_complex: {label: Save complex pressure field}

  calibration.focal_reference: {label: Focal-depth reference, advanced: true}

  # Pipeline stages
  modules.*: {advanced: true}
  modules.run_transducer_placement: {label: Resolve placement}
  modules.run_grid_setup: {label: Grid and head model}
  modules.run_medium_setup: {label: Medium properties}
  modules.run_source_setup: {label: Acoustic source}
  modules.run_water_baseline: {label: Free-water baseline run, help: "Free-water simulation that measures the ISPPA of the current drive, so results can be scaled to transducer.target_isppa_wcm2. 'auto' runs it when a target needs it (no library calibration, or a target different from it); 1 always; 0 only when the target differs from a calibration. A target that cannot be met stops the run. See doc_simulations-acoustic.md#isppa-targeting."}
  modules.run_acoustic_sims: {label: Acoustic simulation, advanced: false}
  modules.run_acoustic_analysis: {label: Acoustic analysis}
  modules.run_heating_sims: {label: Thermal simulation, advanced: false}
  modules.run_thermal_analysis: {label: Thermal analysis}
  modules.run_nifti_creation: {label: NIfTI export}
  modules.run_posthoc_water_sims: {label: Free-water comparison after the head simulation, advanced: false}
  modules.run_targeting_analysis: {label: Targeting accuracy, advanced: false}
  modules.generate_report: {label: HTML report, advanced: false}
  report.style: {label: Report style}
  report.style_switcher: {label: Embed report style switcher}
  report.segmentation: {label: Segmentation report}
  report.debug: {label: Debug report}
  modules.generate_group_report: {label: Update group report after each subject, advanced: false}
  modules.segmentation_only: {label: Stop after segmentation}

  # Study
  study.manifest: {label: Manifest file, group: __manifest_editor__}   # edited in the manifest card
  study.name: {label: Study name}

  # HPC
  hpc.name: {label: Cluster profile, advanced: true}
  hpc.gpu: {label: GPU request, help: "Scheduler GPU request, e.g. 'nvidia_a100-sxm4-40gb:1' (SLURM --gres); empty = any GPU when the code type needs one."}
  hpc.partition: {label: Partition, help: "SLURM partition; empty = 'gpu' for GPU code, the cluster default otherwise. Ignored by qsub."}
  hpc.reservation: {label: Reservation, advanced: true, help: Scheduler reservation name (optional).}
