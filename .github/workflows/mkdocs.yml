name: Deploy PRESTUS Docs

# Versioned documentation site (https://donders-institute.github.io/PRESTUS/):
#   main/          the main branch; the default, and where the site root and the
#                  old unversioned page URLs redirect
#   development/   the development branch (unreleased changes)
#   vX.Y.Z/        release tags, frozen as tagged
# Each run builds one version with that checkout's own toolchain
# (.github/scripts/build_docs.sh), places it on the gh-pages branch
# (.github/scripts/deploy_docs_version.py, which also writes versions.json for the
# version selector), keeps gh-pages as a single commit, and publishes the tree.
# Run it by hand with a release tag (e.g. v0.6.1) to add or rebuild that version.

on:
  push:
    branches: [ development, main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or release tag to build (empty = the branch this runs on)
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Which version
      id: which
      env:
        INPUT_REF: ${{ inputs.ref }}
      run: |
        ref="${INPUT_REF:-$GITHUB_REF_NAME}"
        if git rev-parse -q --verify "refs/tags/$ref" >/dev/null; then
          sha=$(git rev-parse "refs/tags/$ref^{commit}")
        elif git rev-parse -q --verify "refs/remotes/origin/$ref" >/dev/null; then
          sha=$(git rev-parse "refs/remotes/origin/$ref")
        else
          echo "::error::no branch or tag '$ref'"; exit 1
        fi
        git worktree add --detach src "$sha"
        banner=""
        case "$ref" in
          main)
            name=main
            ver=$(tr -d '[:space:]' < src/VERSION 2>/dev/null || true)
            tag=$(git -C src describe --tags --exact-match 2>/dev/null || true)
            if [ -n "$ver" ] && [ "$tag" = "$ver" ]; then title="main ($ver)"
            elif [ -n "$ver" ]; then title="main ($ver+)"
            else title="main"; fi ;;
          development)
            name=development; title="development"
            banner="These pages describe the development branch." ;;
          v[0-9]*)
            name="$ref"; title="$ref"
            banner="This is the documentation of release $ref, as tagged." ;;
          *)
            echo "::error::'$ref' is not main, development, or a release tag"; exit 1 ;;
        esac
        { echo "name=$name"; echo "title=$title"; echo "banner=$banner"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
        echo "Building $name ('$title') from $sha"

    - name: Install docs tools
      run: |
        pip install -U pip
        pip install "zensical==0.1.1" "mkdocs<2" mkdocs-material mkdocs-redirects pymdown-extensions pyyaml
        if [ -f src/requirements-docs.txt ]; then pip install -r src/requirements-docs.txt; fi

    - name: Build
      env:
        BANNER: ${{ steps.which.outputs.banner }}
        NAME: ${{ steps.which.outputs.name }}
      run: bash .github/scripts/build_docs.sh src "$RUNNER_TEMP/site" "$NAME" "$BANNER"

    - name: Place this version on gh-pages
      id: place
      env:
        NAME: ${{ steps.which.outputs.name }}
        TITLE: ${{ steps.which.outputs.title }}
        SHA: ${{ steps.which.outputs.sha }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git fetch origin gh-pages; then
          git worktree add --detach pages FETCH_HEAD
        else
          git worktree add --detach pages
          git -C pages rm -rq --ignore-unmatch .
        fi
        python .github/scripts/deploy_docs_version.py --site "$RUNNER_TEMP/site" --pages pages \
          --version "$NAME" --title "$TITLE" --default main
        # gh-pages holds one commit: the current site, without the history of every deploy
        git -C pages checkout -q --orphan site
        git -C pages add -A
        git -C pages commit -qm "Docs site ($NAME at ${SHA::8})"
        git -C pages push -f origin HEAD:refs/heads/gh-pages
        # publish once the default version exists; a run started by a tag push only
        # updates gh-pages (the github-pages environment may not allow tags), and the
        # next run on main or development publishes it
        if [ -f pages/main/index.html ] && [ "$GITHUB_REF_TYPE" != tag ]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/upload-pages-artifact@v3
      if: steps.place.outputs.ready == 'true'
      with:
        path: ./pages

    - name: Deploy to GitHub Pages
      if: steps.place.outputs.ready == 'true'
      id: deployment
      uses: actions/deploy-pages@v4
