name: Tests

# Level 0 (docs + Nexus) and level 1 (MATLAB unit tests) run on every push and
# pull request; level 2 (free-water physics benchmarks, ~5 min CPU) runs weekly
# and on demand, as does the telemetry server check. Levels 3-4 (demo subject, 3D benchmarks, backends) need data or
# a GPU and are run by maintainers before a release (doc/doc_testing.md).

on:
  push:
    branches: [development, main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'          # Mondays 03:00 UTC: physics benchmarks
  workflow_dispatch:
    inputs:
      physics:
        description: Also run the physics benchmarks
        type: boolean
        default: true
      telemetry:
        description: Also check the telemetry server accepts PRESTUS's events (adds 4 rows)
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements-docs.txt
      - name: Function index is up to date
        run: python tests/docs/gen_function_index.py --check
      - name: Test map is up to date
        run: python tests/docs/gen_test_map.py --check
      - name: Option icons match the Nexus drawings
        run: python tests/docs/gen_doc_icons.py --check
      - name: Load calculator data matches throughput.yaml
        run: python tests/docs/gen_load_data.py --check
      - name: Every config key is documented, defaults match
        run: python tests/docs/check_param_docs.py
      - name: Relative links resolve
        run: python tests/docs/check_links.py
      - name: Images and PRESTUS_bin files exist
        run: python tests/docs/check_images.py
      - name: Site builds without warnings (Zensical, as deployed)
        run: zensical build --strict -f mkdocs.yaml

  docs-mkdocs:
    # The same mkdocs.yaml built with MkDocs + Material, which the versioned (mike) deploy
    # still uses. Non-blocking; a failure flags a feature only Zensical supports.
    name: Docs build with MkDocs (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements-docs.txt
      - name: Site builds without warnings
        run: mkdocs build --strict -d "$RUNNER_TEMP/site"

  nexus:
    name: Nexus (pytest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: nexus
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install
        run: pip install -e ".[test]"
      - name: Tests (without MATLAB)
        run: python -m pytest -q -m "not matlab"

  matlab-unit:
    name: MATLAB unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Submodules (BabelBrain is not needed for these tests)
        run: git submodule update --init --depth 1 external/k-wave external/export_fig external/xml2struct external/FEX-minimize external/PlanTUS
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b
          products: >
            Optimization_Toolbox
            Signal_Processing_Toolbox
            Image_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Parallel_Computing_Toolbox
            Global_Optimization_Toolbox
            Computer_Vision_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: cd tests; run_all_tests('unit')

  matlab-physics:
    name: MATLAB physics benchmarks (2D axisymmetric)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.physics)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Submodules
        run: git submodule update --init --depth 1 external/k-wave external/export_fig external/xml2struct external/FEX-minimize external/PlanTUS
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b
          products: >
            Optimization_Toolbox
            Signal_Processing_Toolbox
            Image_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Parallel_Computing_Toolbox
            Global_Optimization_Toolbox
            Computer_Vision_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: cd tests; run_all_tests('physics')

  matlab-telemetry-live:
    name: Telemetry server accepts PRESTUS events
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.telemetry)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Submodules
        run: git submodule update --init --depth 1 external/k-wave external/export_fig external/xml2struct external/FEX-minimize external/PlanTUS
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b
      - uses: matlab-actions/run-command@v2
        with:
          command: cd tests; run_all_tests('telemetry_live')
