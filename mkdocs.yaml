plugins:
  - search
  - redirects:          # renamed pages: old URLs keep working (mkdocs-redirects)
      redirect_maps:
        doc_preproc.md: doc_head-model.md
        doc_limited_fov.md: doc_partial-fov.md
        doc_calibration_refinement.md: doc_calibration_hydrophone-profiles.md
        doc_getting-started.md: doc_first-simulation.md
        doc_nexus_calibration-localite.md: doc_nexus_tabs.md

extra:
  version:
    provider: mike
    default: main

markdown_extensions:
  - abbr                    # Abbreviations
  - admonition              # !!! note, !!! warning boxes
  - attr_list               # { width=... } on images, { #id } on headings
  - def_list                # glossary definition lists
  - pymdownx.details        # ??? collapsible admonitions
  - toc:                    # Table of contents
      permalink: true
  - tables                  # | tables |
  - pymdownx.highlight      # Code highlighting
  - pymdownx.superfences    # ``` fences with highlighting
  - md_in_html                # Markdown inside <details> blocks
  - pymdownx.arithmatex:
      generic: true         # Enables $...$ and $$...$$

extra_css:
  - stylesheets/extra.css
  - stylesheets/usage_statistics.css
  - stylesheets/load_predictor.css
  - stylesheets/thermal_pulse_model.css

extra_javascript:
  - https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/header_home_link.js
  - javascripts/developer_details.js
  - javascripts/usage_statistics.js
  - javascripts/multitransducer_fields.js
  - javascripts/time_reversal_fields.js
  - javascripts/thermal_pulse_model.js
  - javascripts/load_model_data.js
  - javascripts/load_predictor.js
