site_name: PRESTUS - Ultrasound Simulation Toolbox
docs_dir: doc
site_description: 'PREprocessing & Simulations Toolbox for transcranial Ultrasound neuromodulation'
site_url: https://donders-institute.github.io/PRESTUS
site_author: Donders Institute for Brain, Cognition and Behaviour

copyright: Copyright &copy; 2022–2026 PRESTUS contributors · <a href="https://github.com/Donders-Institute/PRESTUS/blob/main/LICENSE">GPL-3.0</a>

repo_url: https://github.com/Donders-Institute/PRESTUS
repo_name: Donders-Institute/PRESTUS

theme:
  name: material
  custom_dir: overrides   # main.html: short browser-tab title
  variant: classic   # Zensical (builds the published site): the Material look; ignored by MkDocs + Material (mike deploy)
  logo: https://github.com/jkosciessa/PRESTUS_bin/raw/main/img/logo_PRESTUS_dark.png   # transparent, light ink for the dark header
  favicon: https://github.com/jkosciessa/PRESTUS_bin/raw/main/img/favicon_PRESTUS.png
  features:
    - navigation.sections
    - content.code.copy
  palette:
    # Follow the system (macOS / Windows light or dark appearance, via the browser)
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:          # loaded from Google Fonts by the theme (as the published v0.6 site)
    text: Roboto
    code: Roboto Mono

