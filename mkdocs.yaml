site_name: PRESTUS - Ultrasound Simulation Toolbox
docs_dir: doc
site_description: 'PREprocessing & Simulations Toolbox for transcranial Ultrasound neuromodulation'
site_url: https://donders-institute.github.io/PRESTUS
site_author: Donders Institute for Brain, Cognition and Behaviour

repo_url: https://github.com/Donders-Institute/PRESTUS
repo_name: Donders-Institute/PRESTUS

theme:
  name: material
  icon:
    logo: material/waves
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
  palette:
    # Light mode toggle
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
        
    # Dark mode toggle  
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  fonts:
    text: Roboto
    code: Roboto Mono

nav:
  - 🏠 Home: README.md
  - 🧭 Get Started:
    - Concepts: doc_concepts.md
    - Installation: doc_installation.md
    - Your First Simulation: doc_getting-started.md
    - Reading Your Results: doc_results.md
    - Configuring a Study: doc_configuration.md
    - PRESTUS Nexus: doc_nexus.md
    - MATLAB GUI: doc_gui.md
  - 🧠 Head Model:
    - Segmentation & Preprocessing: doc_preproc.md
    - Medium Setup: doc_medium.md
    - (pseudo-)CT: doc_pseudoCT.md
  - 🔧 Transducer:
    - Transducer Definition: doc_transducer.md
    - Transducer Library: doc_transducer_library.md
    - Calibration: doc_calibration.md
    - Adding & Maintaining Entries: doc_transducer_library_maintenance.md
  - 🎯 Placement:
    - Overview & Manual: doc_placement.md
    - MNI: doc_placement_mni.md
    - Heuristic: doc_placement_heuristic.md
    - PlanTUS: doc_placement_plantus.md
    - TUS_entry: doc_placement_tus_entry.md
    - Localite Placement: doc_placement_neuronav.md
    - Localite Ingestion (GUI & Script): doc_placement_neuronav_workflows.md
    - Localite Multi-Target Toolkit: doc_placement_neuronav_multitarget.md
  - 🖥️ Simulation:
    - Acoustic: doc_simulations-acoustic.md
    - Thermal: doc_simulations-thermal.md
    - Limited Acoustic FOV: doc_limited_fov.md
    - Time Reversal: doc_time_reversal.md
  - ▶️ Running & Outputs:
    - Running on a Cluster: doc_hpc.md
    - Partial Runs (Modules): doc_modules.md
    - Outputs & Reports: doc_outputs.md
    - Studies & Group Analysis: doc_group.md
  - 📊 Advanced Modes:
    - Overview: doc_advanced.md
    - Multi-Intensity: doc_multiintensity.md
    - Multi-Transducer: doc_multitransducer.md
    - Sequential: doc_sequential.md
    - Uncertainty Analysis: doc_uncertainty.md
  - ⚙️ Backends:
    - Overview: doc_backend.md
    - k-Wave (Default): doc_kwave.md
    - BabelBrain: doc_babelbrain.md
    - jwave: doc_jwave.md
  - 📚 Reference:
    - Glossary: doc_glossary.md
    - Parameters: doc_parameters.md
    - Functions: doc_functions.md
    - Coordinate Systems: doc_coordinate_systems.md
    - How PRESTUS Works: doc_architecture.md
  - 🛟 Help:
    - Troubleshooting: doc_troubleshooting.md
    - Changelog: CHANGELOG.md
  - 🛠️ Developers:
    - Contributing: CONTRIBUTING.md
    - Testing: doc_testing.md
    - BabelBrain Internals: doc_babelbrain_internals.md
    - Telemetry: doc_telemetry.md
    - Usage Statistics: doc_usage_statistics.md
    - Code of Conduct: CODE_OF_CONDUCT.md

plugins:
  - search

extra:
  version:
    provider: mike
    default: main

markdown_extensions:
  - abbr                    # Abbreviations
  - admonition              # !!! note, !!! warning boxes
  - attr_list               # { width=... } on images, { #id } on headings
  - def_list                # glossary definition lists
  - pymdownx.details        # ??? collapsible admonitions
  - toc:                    # Table of contents
      permalink: true
  - tables                  # | tables |
  - pymdownx.highlight      # Code highlighting
  - pymdownx.superfences    # ``` fences with highlighting
  - md_in_html                # Markdown inside <details> blocks
  - pymdownx.arithmatex:
      generic: true         # Enables $...$ and $$...$$

extra_css:
  - stylesheets/extra.css
  - stylesheets/usage_statistics.css

extra_javascript:
  - https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/header_home_link.js
  - javascripts/usage_statistics.js